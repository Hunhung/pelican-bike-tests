<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  /* ===== 页面布局 ===== */
  html, body {
    margin: 0;
    padding: 0;
    background: #eef4f8;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .stage {
    max-width: 920px;
    margin: 24px auto;
    padding: 0 16px;
  }
  h1 {
    font-size: 20px;
    color: #33505e;
    text-align: center;
    margin: 12px 0 16px;
    font-weight: 600;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(60, 90, 110, 0.18);
  }

  /* ===== 车身 + 鹈鹕 整体上下颠簸（与蹬踏节奏同步） ===== */
  #bikeBird {
    animation: bounce 0.55s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-7px); }
  }

  /* ===== 翅膀扇动 ===== */
  #wing {
    transform-origin: 300px 205px;
    animation: flap 1.1s ease-in-out infinite;
  }
  @keyframes flap {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-10deg); }
  }

  /* ===== 云朵向后飘 ===== */
  .cloud { animation: cloudMove linear infinite; }
  .cloud1 { animation-duration: 26s; }
  .cloud2 { animation-duration: 38s; }
  @keyframes cloudMove {
    from { transform: translateX(0); }
    to   { transform: translateX(-800px); }
  }

  /* ===== 地面条纹 / 灌木 后退 ===== */
  .roadStripe { animation: roadMove 0.9s linear infinite; }
  @keyframes roadMove {
    from { transform: translateX(0); }
    to   { transform: translateX(-96px); }
  }
  .bush { animation: bushMove 6s linear infinite; }
  @keyframes bushMove {
    from { transform: translateX(0); }
    to   { transform: translateX(-800px); }
  }
</style>
</head>
<body>
<div class="stage">
  <h1>鹈鹕骑自行车 · SVG 2D 动画</h1>

  <!-- viewBox 坐标：宽 800，高 520；地面约在 y=420 -->
  <svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕骑着红色自行车在乡间小路上前行">
    <defs>
      <!-- 天空渐变 -->
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#aedcf2"/>
        <stop offset="100%" stop-color="#e8f6fc"/>
      </linearGradient>
      <!-- 草地渐变 -->
      <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#93d67f"/>
        <stop offset="100%" stop-color="#6fb862"/>
      </linearGradient>
    </defs>

    <!-- ===== 1. 天空 ===== -->
    <rect x="0" y="0" width="800" height="520" fill="url(#sky)"/>

    <!-- 太阳 -->
    <circle cx="660" cy="90" r="42" fill="#ffd966" opacity="0.9"/>
    <circle cx="660" cy="90" r="56" fill="#ffd966" opacity="0.25"/>

    <!-- ===== 2. 云朵（每组两份平铺，平移 800px 无缝循环） ===== -->
    <g class="cloud cloud1">
      <!-- 第一份 -->
      <ellipse cx="120" cy="90"  rx="38" ry="18" fill="#ffffff" opacity="0.95"/>
      <ellipse cx="150" cy="80"  rx="30" ry="16" fill="#ffffff" opacity="0.95"/>
      <ellipse cx="620" cy="70"  rx="42" ry="20" fill="#ffffff" opacity="0.9"/>
      <ellipse cx="660" cy="62"  rx="28" ry="14" fill="#ffffff" opacity="0.9"/>
      <!-- 第二份（右移 800，循环时补位） -->
      <ellipse cx="920"  cy="90" rx="38" ry="18" fill="#ffffff" opacity="0.95"/>
      <ellipse cx="950"  cy="80" rx="30" ry="16" fill="#ffffff" opacity="0.95"/>
      <ellipse cx="1420" cy="70" rx="42" ry="20" fill="#ffffff" opacity="0.9"/>
      <ellipse cx="1460" cy="62" rx="28" ry="14" fill="#ffffff" opacity="0.9"/>
    </g>
    <g class="cloud cloud2">
      <ellipse cx="420" cy="130" rx="34" ry="15" fill="#ffffff" opacity="0.8"/>
      <ellipse cx="780" cy="120" rx="36" ry="16" fill="#ffffff" opacity="0.85"/>
      <ellipse cx="1220" cy="130" rx="34" ry="15" fill="#ffffff" opacity="0.8"/>
      <ellipse cx="1580" cy="120" rx="36" ry="16" fill="#ffffff" opacity="0.85"/>
    </g>

    <!-- ===== 3. 远处灌木（双份平铺，后退无缝） ===== -->
    <g class="bush">
      <circle cx="100" cy="410" r="26" fill="#5da854"/>
      <circle cx="130" cy="414" r="20" fill="#6cbb62"/>
      <circle cx="360" cy="412" r="24" fill="#5da854"/>
      <circle cx="590" cy="414" r="28" fill="#6cbb62"/>
      <circle cx="820" cy="410" r="24" fill="#5da854"/>
      <circle cx="900"  cy="410" r="26" fill="#5da854"/>
      <circle cx="930"  cy="414" r="20" fill="#6cbb62"/>
      <circle cx="1160" cy="412" r="24" fill="#5da854"/>
      <circle cx="1390" cy="414" r="28" fill="#6cbb62"/>
      <circle cx="1620" cy="410" r="24" fill="#5da854"/>
    </g>

    <!-- ===== 4. 草地 + 路面 ===== -->
    <rect x="0" y="420" width="800" height="100" fill="url(#grass)"/>
    <rect x="0" y="440" width="800" height="80" fill="#cdb894"/>

    <!-- 路面白色虚线（两组错开，循环后退） -->
    <g class="roadStripe">
      <rect x="0"   y="478" width="48" height="8" rx="4" fill="#f3ead6"/>
      <rect x="96"  y="478" width="48" height="8" rx="4" fill="#f3ead6"/>
      <rect x="192" y="478" width="48" height="8" rx="4" fill="#f3ead6"/>
      <rect x="288" y="478" width="48" height="8" rx="4" fill="#f3ead6"/>
      <rect x="384" y="478" width="48" height="8" rx="4" fill="#f3ead6"/>
      <rect x="480" y="478" width="48" height="8" rx="4" fill="#f3ead6"/>
      <rect x="576" y="478" width="48" height="8" rx="4" fill="#f3ead6"/>
      <rect x="672" y="478" width="48" height="8" rx="4" fill="#f3ead6"/>
      <rect x="768" y="478" width="48" height="8" rx="4" fill="#f3ead6"/>
    </g>

    <!-- ===== 5. 自行车 + 鹈鹕（整体颠簸） ===== -->
    <g id="bikeBird">

      <!-- ---------- 后轮 ---------- -->
      <g id="rearWheel">
        <circle cx="250" cy="360" r="58" fill="none" stroke="#2f3a42" stroke-width="10"/>
        <circle cx="250" cy="360" r="46" fill="#f2f5f7" stroke="#9aa7b0" stroke-width="2"/>
        <g id="rearSpokes" stroke="#9aa7b0" stroke-width="2.5">
          <line x1="250" y1="316" x2="250" y2="404"/>
          <line x1="206" y1="360" x2="294" y2="360"/>
          <line x1="219" y1="329" x2="281" y2="391"/>
          <line x1="281" y1="329" x2="219" y2="391"/>
        </g>
        <circle cx="250" cy="360" r="7" fill="#2f3a42"/>
      </g>

      <!-- ---------- 前轮 ---------- -->
      <g id="frontWheel">
        <circle cx="510" cy="360" r="58" fill="none" stroke="#2f3a42" stroke-width="10"/>
        <circle cx="510" cy="360" r="46" fill="#f2f5f7" stroke="#9aa7b0" stroke-width="2"/>
        <g id="frontSpokes" stroke="#9aa7b0" stroke-width="2.5">
          <line x1="510" y1="316" x2="510" y2="404"/>
          <line x1="466" y1="360" x2="554" y2="360"/>
          <line x1="479" y1="329" x2="541" y2="391"/>
          <line x1="541" y1="329" x2="479" y2="391"/>
        </g>
        <circle cx="510" cy="360" r="7" fill="#2f3a42"/>
      </g>

      <!-- ---------- 车架（红色菱形） ---------- -->
      <g stroke="#d94f4f" stroke-width="8" stroke-linecap="round" fill="none">
        <line x1="250" y1="360" x2="330" y2="270"/>  <!-- 后上叉：后轴 → 车座 -->
        <line x1="250" y1="360" x2="380" y2="360"/>  <!-- 后下叉：后轴 → 中轴 -->
        <line x1="330" y1="270" x2="380" y2="360"/>  <!-- 座管：车座 → 中轴 -->
        <line x1="330" y1="270" x2="470" y2="275"/>  <!-- 上管：车座 → 车把 -->
        <line x1="380" y1="360" x2="470" y2="275"/>  <!-- 下管：中轴 → 车把 -->
        <line x1="470" y1="275" x2="510" y2="360"/>  <!-- 前叉：车把 → 前轴 -->
      </g>

      <!-- 车座 -->
      <path d="M312 266 Q330 258 352 266 L348 274 L316 274 Z" fill="#2f3a42"/>
      <!-- 车把 -->
      <path d="M470 275 L486 258 M486 258 L500 262" stroke="#2f3a42" stroke-width="7" stroke-linecap="round" fill="none"/>

      <!-- ---------- 牙盘 + 曲柄臂（JS 驱动旋转） ---------- -->
      <g id="crankSet">
        <circle cx="380" cy="360" r="18" fill="none" stroke="#7a8790" stroke-width="4"/>
        <line id="crankArm" x1="380" y1="360" x2="414" y2="360" stroke="#4a555d" stroke-width="6" stroke-linecap="round"/>
      </g>

      <!-- 左右踏板（不随曲柄翻转，由 JS 直接定位到圆周端点） -->
      <g id="pedalA">
        <rect x="-8" y="-5" width="16" height="10" rx="3" fill="#2f3a42"/>
      </g>
      <g id="pedalB">
        <rect x="-8" y="-5" width="16" height="10" rx="3" fill="#2f3a42"/>
      </g>

      <!-- ---------- 鹈鹕的两条腿（端点由 JS 跟随踏板） ---------- -->
      <g stroke="#e8913a" stroke-width="7" stroke-linecap="round" fill="none">
        <polyline id="legA" points="338,300 330,326 414,360"/>
        <polyline id="legB" points="330,302 338,328 346,360"/>
      </g>

      <!-- ---------- 鹈鹕身体 ---------- -->
      <g id="bird">
        <!-- 尾巴 -->
        <path d="M266 220 L238 208 L258 238 Z" fill="#5f7386"/>

        <!-- 身体 -->
        <ellipse cx="318" cy="228" rx="56" ry="40" fill="#f4f6f8"/>
        <!-- 肚皮 -->
        <ellipse cx="332" cy="240" rx="38" ry="26" fill="#ffffff" opacity="0.85"/>

        <!-- 翅膀（扇动） -->
        <g id="wing">
          <path d="M300 196 Q268 214 276 248 Q304 256 332 240 Q318 214 300 196 Z" fill="#5f7386"/>
          <path d="M292 210 Q278 224 282 240" stroke="#4a5d6e" stroke-width="2" fill="none"/>
        </g>

        <!-- 长脖子（S 形白柱） -->
        <path d="M348 202 Q372 186 384 172" stroke="#f4f6f8" stroke-width="22" stroke-linecap="round" fill="none"/>

        <!-- 头 -->
        <circle cx="391" cy="168" r="17" fill="#f4f6f8"/>

        <!-- 上喙（长直，黄橙色） -->
        <path d="M404 160 Q434 160 458 168 Q434 176 404 175 Z" fill="#f2a93b"/>
        <!-- 鹈鹕标志性大喉囊 -->
        <path d="M404 174 Q412 206 440 197 Q449 188 447 184 Q424 178 404 174 Z" fill="#f7b955"/>

        <!-- 眼睛 -->
        <circle cx="395" cy="164" r="2.8" fill="#222a30"/>
        <circle cx="396" cy="163" r="0.9" fill="#ffffff"/>
      </g>
    </g>
  </svg>
</div>

<script>
  /* ============================================================
     JS 动画逻辑（原生，无依赖）
     思路：蹬车一圈 = 周期 1.1 秒；每一帧根据时间算出曲柄角度 θ，
     然后：① 两个车轮、牙盘按 θ 旋转；② 左右踏板走到圆周上对应位置；
     ③ 两条腿的末端跟着踏板移动，膝盖做简单外偏。
     ============================================================ */

  // 关键坐标（与 SVG 中保持一致）
  var CRANK = { x: 380, y: 360, arm: 34 }; // 中轴位置 + 曲柄长度
  var REAR  = { x: 250, y: 360 };
  var FRONT = { x: 510, y: 360 };
  var HIPS  = [{ x: 338, y: 300 }, { x: 330, y: 302 }]; // 两条腿的髋部起点

  var PERIOD = 1100; // 蹬一圈的毫秒数

  // 取出需要操作的 SVG 元素
  var rearSpokes  = document.getElementById('rearSpokes');
  var frontSpokes = document.getElementById('frontSpokes');
  var crankSet    = document.getElementById('crankSet');
  var pedalA      = document.getElementById('pedalA');
  var pedalB      = document.getElementById('pedalB');
  var legA        = document.getElementById('legA');
  var legB        = document.getElementById('legB');

  // 把角度（度）转成弧度，供三角函数使用
  function deg2rad(deg) { return deg * Math.PI / 180; }

  // 根据当前曲柄角度 θ（度），更新所有元素
  function frame(now) {
    // 归一化到 0~360 度：时间除以周期再取余
    var theta = (now / PERIOD) * 360 % 360;
    var rad = deg2rad(theta);

    // ① 车轮辐条、牙盘同步旋转（rotate 围绕各自圆心）
    rearSpokes.setAttribute('transform',  'rotate(' + theta + ' ' + REAR.x + ' ' + REAR.y + ')');
    frontSpokes.setAttribute('transform', 'rotate(' + theta + ' ' + FRONT.x + ' ' + FRONT.y + ')');
    crankSet.setAttribute('transform',    'rotate(' + theta + ' ' + CRANK.x + ' ' + CRANK.y + ')');

    // ② 计算左右踏板的世界坐标（B 与 A 相差 180°）
    var px = CRANK.arm * Math.cos(rad);
    var py = CRANK.arm * Math.sin(rad);
    var pedalAPos = { x: CRANK.x + px, y: CRANK.y + py };
    var pedalBPos = { x: CRANK.x - px, y: CRANK.y - py };

    // 踏板矩形以自身中心为原点，直接平移到踏板点
    pedalA.setAttribute('transform', 'translate(' + pedalAPos.x + ',' + pedalAPos.y + ')');
    pedalB.setAttribute('transform', 'translate(' + pedalBPos.x + ',' + pedalBPos.y + ')');

    // ③ 更新腿：髋 → 膝盖（中点向左外偏 10px）→ 踏板
    function updateLeg(legEl, hip, pedal) {
      var kneeX = (hip.x + pedal.x) / 2 - 10;
      var kneeY = (hip.y + pedal.y) / 2 + 4;
      legEl.setAttribute('points',
        hip.x + ',' + hip.y + ' ' +
        kneeX + ',' + kneeY + ' ' +
        pedal.x + ',' + pedal.y
      );
    }
    updateLeg(legA, HIPS[0], pedalAPos);
    updateLeg(legB, HIPS[1], pedalBPos);

    requestAnimationFrame(frame);
  }

  // 启动动画循环
  requestAnimationFrame(frame);
</script>
</body>
</html>
