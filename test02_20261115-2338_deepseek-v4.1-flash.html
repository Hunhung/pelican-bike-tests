<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鹈鹕骑自行车 · SVG 动画</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0;
    background: radial-gradient(circle at 50% 0%, #f2f8fb 0%, #e2ecf2 70%);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .stage {
    width: min(96vw, 1080px);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 30px 70px -28px rgba(31, 66, 88, .45),
                0 2px 6px rgba(31, 66, 88, .08);
    background: #dff0f9;
    line-height: 0;
  }
  svg { display: block; width: 100%; height: auto; }

  /* ================= 轮子 / 曲柄 ================= */
  .spin { animation: spin 1.1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ================= 腿（大腿摆动 + 小腿反向） ================= */
  .leg-a { animation: legSwing 1.1s ease-in-out infinite; }
  .leg-b { animation: legSwing 1.1s ease-in-out infinite; animation-delay: -.55s; }
  @keyframes legSwing {
    0%   { transform: rotate(-10deg); }
    50%  { transform: rotate(10deg); }
    100% { transform: rotate(-10deg); }
  }
  .shin-a { animation: shinSwing 1.1s ease-in-out infinite; }
  .shin-b { animation: shinSwing 1.1s ease-in-out infinite; animation-delay: -.55s; }
  @keyframes shinSwing {
    0%   { transform: rotate(13deg); }
    50%  { transform: rotate(-13deg); }
    100% { transform: rotate(13deg); }
  }

  /* ================= 身体起伏 / 头 / 喉囊 / 翅膀 ================= */
  .bob { animation: bob 1.1s ease-in-out infinite; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-4px); }
  }
  .head-bob {
    transform-origin: 402px 196px;
    animation: headBob 1.1s ease-in-out infinite;
  }
  @keyframes headBob {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-2.6deg); }
  }
  .pouch {
    transform-origin: 470px 162px;
    animation: pouchWob 1.1s ease-in-out infinite;
  }
  @keyframes pouchWob {
    0%, 100% { transform: scaleY(1); }
    50%      { transform: scaleY(1.1); }
  }
  .wing {
    transform-origin: 350px 204px;
    animation: wingFlap 2.2s ease-in-out infinite;
  }
  @keyframes wingFlap {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-2.2deg); }
  }
  .blink {
    transform-box: fill-box;
    transform-origin: center;
    animation: blink 4.6s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 90%, 100% { transform: scaleY(1); }
    94%           { transform: scaleY(.08); }
  }

  /* ================= 背景 ================= */
  .cloud-fly {
    animation-name: drift;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  @keyframes drift {
    from { transform: translateX(880px); }
    to   { transform: translateX(-240px); }
  }
  .hill-fly { animation: hills linear infinite; }
  @keyframes hills {
    from { transform: translateX(0); }
    to   { transform: translateX(-800px); }
  }
  .road-fly { animation: road .45s linear infinite; }
  @keyframes road {
    from { transform: translateX(0); }
    to   { transform: translateX(-160px); }
  }
  .streak { animation: streak 1.1s linear infinite; }
  @keyframes streak {
    0%   { transform: translateX(50px);  opacity: 0; }
    25%  { opacity: .75; }
    100% { transform: translateX(-150px); opacity: 0; }
  }
  .puff {
    transform-box: fill-box;
    transform-origin: center;
    animation: puff 1.1s linear infinite;
  }
  @keyframes puff {
    0%   { transform: translate(0, 0) scale(.35); opacity: 0; }
    20%  { opacity: .6; }
    100% { transform: translate(-78px, -22px) scale(1.7); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">鹈鹕骑自行车</title>
  <desc id="desc">一只白色鹈鹕蹬着青绿色自行车向右前行，轮子与曲柄转动，双腿交替踩踏，背景的云、山与路面虚线向后流动。</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#bfe3f7"/>
      <stop offset="52%"  stop-color="#e4f2fa"/>
      <stop offset="100%" stop-color="#f8fcfe"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0%"   stop-color="#ffeaa8" stop-opacity=".95"/>
      <stop offset="55%"  stop-color="#ffe08a" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#ffe08a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0.1" y1="0" x2="0.6" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="62%"  stop-color="#f5f9fb"/>
      <stop offset="100%" stop-color="#dfe9ef"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0%"   stop-color="#f7b53e"/>
      <stop offset="100%" stop-color="#eb9321"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%"   stop-color="#fcd481"/>
      <stop offset="100%" stop-color="#efa736"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e2dac8"/>
      <stop offset="100%" stop-color="#cdc3ae"/>
    </linearGradient>
    <radialGradient id="shadowGrad">
      <stop offset="0%"   stop-color="#6f8368" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#6f8368" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ==================== 背景 ==================== -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="656" cy="92" r="78" fill="url(#sunGlow)"/>
  <circle cx="656" cy="92" r="30" fill="#ffd76e"/>

  <!-- 云 -->
  <g transform="translate(0,72)">
    <g class="cloud-fly" style="animation-duration:48s;animation-delay:-3s" opacity=".92">
      <circle cx="0" cy="0" r="20" fill="#fff"/><circle cx="25" cy="-13" r="27" fill="#fff"/>
      <circle cx="55" cy="2" r="18" fill="#fff"/><rect x="-20" y="-2" width="95" height="22" rx="11" fill="#fff"/>
    </g>
  </g>
  <g transform="translate(0,124)">
    <g class="cloud-fly" style="animation-duration:66s;animation-delay:-26s" opacity=".8">
      <circle cx="0" cy="0" r="15" fill="#fff"/><circle cx="20" cy="-9" r="20" fill="#fff"/>
      <circle cx="42" cy="2" r="14" fill="#fff"/><rect x="-15" y="-2" width="72" height="17" rx="8" fill="#fff"/>
    </g>
  </g>
  <g transform="translate(0,52)">
    <g class="cloud-fly" style="animation-duration:54s;animation-delay:-40s" opacity=".88">
      <circle cx="0" cy="0" r="17" fill="#fff"/><circle cx="22" cy="-11" r="23" fill="#fff"/>
      <circle cx="48" cy="2" r="16" fill="#fff"/><rect x="-17" y="-2" width="82" height="19" rx="9" fill="#fff"/>
    </g>
  </g>
  <g transform="translate(0,150)">
    <g class="cloud-fly" style="animation-duration:38s;animation-delay:-14s" opacity=".72">
      <circle cx="0" cy="0" r="13" fill="#fff"/><circle cx="17" cy="-8" r="17" fill="#fff"/>
      <circle cx="36" cy="2" r="12" fill="#fff"/><rect x="-13" y="-2" width="62" height="15" rx="7" fill="#fff"/>
    </g>
  </g>

  <!-- 远山 -->
  <g class="hill-fly" style="animation-duration:44s">
    <path d="M0 442 Q100 350 200 442 Q300 318 400 442 Q500 380 600 442 Q700 340 800 442 L800 466 L0 466 Z" fill="#bfe2cc"/>
    <path d="M0 442 Q100 350 200 442 Q300 318 400 442 Q500 380 600 442 Q700 340 800 442 L800 466 L0 466 Z" fill="#bfe2cc" transform="translate(800,0)"/>
  </g>
  <!-- 近山 -->
  <g class="hill-fly" style="animation-duration:24s">
    <path d="M0 442 Q90 388 180 442 Q280 372 380 442 Q480 400 580 442 Q690 382 800 442 L800 470 L0 470 Z" fill="#95cdb0"/>
    <path d="M0 442 Q90 388 180 442 Q280 372 380 442 Q480 400 580 442 Q690 382 800 442 L800 470 L0 470 Z" fill="#95cdb0" transform="translate(800,0)"/>
  </g>

  <!-- 路面 -->
  <rect x="0" y="440" width="800" height="60" fill="url(#roadGrad)"/>
  <rect x="0" y="440" width="800" height="4" fill="#f0ead9"/>
  <g class="road-fly">
    <g fill="#fdf8ea" opacity=".85">
      <rect x="-160" y="468" width="88" height="7" rx="3.5"/>
      <rect x="0"    y="468" width="88" height="7" rx="3.5"/>
      <rect x="160"  y="468" width="88" height="7" rx="3.5"/>
      <rect x="320"  y="468" width="88" height="7" rx="3.5"/>
      <rect x="480"  y="468" width="88" height="7" rx="3.5"/>
      <rect x="640"  y="468" width="88" height="7" rx="3.5"/>
      <rect x="800"  y="468" width="88" height="7" rx="3.5"/>
      <rect x="960"  y="468" width="88" height="7" rx="3.5"/>
    </g>
  </g>

  <!-- 影子 -->
  <ellipse cx="386" cy="443" rx="138" ry="12" fill="url(#shadowGrad)"/>

  <!-- 速度线 -->
  <g stroke="#9fd0c4" stroke-width="5" stroke-linecap="round" opacity=".8">
    <g class="streak" style="animation-delay:-.1s"><line x1="150" y1="230" x2="215" y2="230"/></g>
    <g class="streak" style="animation-delay:-.45s"><line x1="130" y1="292" x2="200" y2="292"/></g>
    <g class="streak" style="animation-delay:-.8s"><line x1="160" y1="352" x2="220" y2="352"/></g>
  </g>

  <!-- 扬尘 -->
  <g fill="#e8e0cd">
    <circle class="puff" cx="292" cy="436" r="9"  style="animation-delay:0s"/>
    <circle class="puff" cx="286" cy="440" r="7"  style="animation-delay:-.36s"/>
    <circle class="puff" cx="298" cy="432" r="11" style="animation-delay:-.72s"/>
  </g>

  <!-- ==================== 自行车 + 鹈鹕 ==================== -->

  <!-- 后轮 -->
  <g class="spin" style="transform-origin:295px 378px">
    <circle cx="295" cy="378" r="62" fill="none" stroke="#2f3640" stroke-width="9"/>
    <circle cx="295" cy="378" r="53" fill="none" stroke="#b7c5ce" stroke-width="3"/>
    <g stroke="#c9d4db" stroke-width="2">
      <line x1="295" y1="316" x2="295" y2="440"/>
      <line x1="233" y1="378" x2="357" y2="378"/>
      <line x1="251" y1="334" x2="339" y2="422"/>
      <line x1="339" y1="334" x2="251" y2="422"/>
    </g>
    <circle cx="295" cy="378" r="7" fill="#2f3640"/>
    <circle cx="295" cy="322" r="4.5" fill="#e76f51"/>
  </g>

  <!-- 前轮 -->
  <g class="spin" style="transform-origin:472px 378px">
    <circle cx="472" cy="378" r="62" fill="none" stroke="#2f3640" stroke-width="9"/>
    <circle cx="472" cy="378" r="53" fill="none" stroke="#b7c5ce" stroke-width="3"/>
    <g stroke="#c9d4db" stroke-width="2">
      <line x1="472" y1="316" x2="472" y2="440"/>
      <line x1="410" y1="378" x2="534" y2="378"/>
      <line x1="428" y1="334" x2="516" y2="422"/>
      <line x1="516" y1="334" x2="428" y2="422"/>
    </g>
    <circle cx="472" cy="378" r="7" fill="#2f3640"/>
    <circle cx="472" cy="322" r="4.5" fill="#e76f51"/>
  </g>

  <!-- 远侧腿（在车架后面） -->
  <g class="leg-b" style="transform-origin:338px 272px">
    <path d="M338 272 L368 325" stroke="#d9883a" stroke-width="11" stroke-linecap="round" fill="none"/>
    <g class="shin-b" style="transform-origin:368px 325px">
      <path d="M368 325 L382 372" stroke="#d9883a" stroke-width="9" stroke-linecap="round" fill="none"/>
      <path d="M382 372 L399 377" stroke="#d9883a" stroke-width="8" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- 车架 -->
  <g fill="none" stroke="#2a9d8f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M380 372 L330 282"/>
    <path d="M380 372 L295 378"/>
    <path d="M295 378 L330 282"/>
    <path d="M380 372 L452 300"/>
    <path d="M330 282 L452 300"/>
    <path d="M452 300 L462 264"/>
    <path d="M462 264 L472 378"/>
    <path d="M462 262 Q490 240 530 251"/>
  </g>
  <!-- 车把套 -->
  <rect x="512" y="242" width="30" height="14" rx="7" fill="#3c4a52" transform="rotate(13 527 249)"/>
  <!-- 车座 -->
  <ellipse cx="328" cy="276" rx="31" ry="9.5" fill="#3c4a52" transform="rotate(-7 328 276)"/>
  <!-- 链条 -->
  <g stroke="#a9b6bd" stroke-width="2.5" fill="none" opacity=".85">
    <path d="M380 358 L296 368"/>
    <path d="M380 386 L296 390"/>
  </g>
  <!-- 牙盘 -->
  <circle cx="380" cy="372" r="15" fill="none" stroke="#7f8c8d" stroke-width="4"/>

  <!-- 曲柄 + 脚踏（脚踏反向自转保持水平） -->
  <g class="spin" style="transform-origin:380px 372px">
    <line x1="380" y1="372" x2="380" y2="390" stroke="#54646e" stroke-width="6" stroke-linecap="round"/>
    <line x1="380" y1="372" x2="380" y2="354" stroke="#54646e" stroke-width="6" stroke-linecap="round"/>
    <g class="spin" style="transform-origin:380px 390px">
      <rect x="365" y="386" width="30" height="8" rx="4" fill="#2f3640"/>
    </g>
    <g class="spin" style="transform-origin:380px 354px; animation-direction: reverse;">
      <rect x="365" y="350" width="30" height="8" rx="4" fill="#2f3640"/>
    </g>
  </g>

  <!-- 近侧腿（在车架前面） -->
  <g class="leg-a" style="transform-origin:338px 272px">
    <path d="M338 272 L368 325" stroke="#f0a04a" stroke-width="12" stroke-linecap="round" fill="none"/>
    <g class="shin-a" style="transform-origin:368px 325px">
      <path d="M368 325 L382 372" stroke="#f0a04a" stroke-width="10" stroke-linecap="round" fill="none"/>
      <path d="M382 372 L401 378" stroke="#f0a04a" stroke-width="9" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- 鹈鹕（整体轻微起伏） -->
  <g class="bob">

    <!-- 尾羽 -->
    <path d="M302 246 L254 230 L264 252 L248 260 L300 272 Z"
          fill="#eaf1f5" stroke="#dbe6ec" stroke-width="2" stroke-linejoin="round"/>

    <!-- 远侧翅膀 -->
    <path d="M360 196 C408 204 458 224 504 248 C510 264 484 278 450 266 C402 250 364 224 360 196 Z"
          fill="#e2ebf1" stroke="#d2dfe7" stroke-width="2"/>

    <!-- 身体 -->
    <ellipse cx="348" cy="236" rx="60" ry="50" transform="rotate(-12 348 236)"
             fill="url(#bodyGrad)" stroke="#dbe6ec" stroke-width="2.5"/>

    <!-- 脖子 -->
    <path d="M382 210 C389 178 404 158 424 150" fill="none" stroke="#fbfdfe"
          stroke-width="36" stroke-linecap="round"/>
    <path d="M382 210 C389 178 404 158 424 150" fill="none" stroke="#e7eff4"
          stroke-width="36" stroke-linecap="round" opacity=".35" stroke-dasharray="0 999"/>
    <!-- 脖子右侧阴影 -->
    <path d="M396 196 C402 176 412 162 426 154" fill="none" stroke="#e3ecf2"
          stroke-width="8" stroke-linecap="round" opacity=".8"/>

    <g class="head-bob">
      <!-- 头 -->
      <circle cx="430" cy="148" r="28" fill="#fdfeff" stroke="#dbe6ec" stroke-width="2.5"/>
      <!-- 冠羽 -->
      <path d="M408 124 C400 110 404 100 414 96 C412 108 418 114 422 122 Z" fill="#eaf1f5" stroke="#dbe6ec" stroke-width="2"/>

      <!-- 喉囊（在下颌，先画） -->
      <g class="pouch">
        <path d="M448 150 C512 152 574 158 598 164 C586 202 542 224 504 217 C466 210 448 182 448 150 Z"
              fill="url(#pouchGrad)" stroke="#e09a2c" stroke-width="2" stroke-linejoin="round"/>
        <path d="M474 178 C504 194 546 196 574 180" fill="none" stroke="#e6a03a"
              stroke-width="2" opacity=".5" stroke-linecap="round"/>
        <path d="M462 160 C482 186 512 200 546 198" fill="none" stroke="#fff0cf"
              stroke-width="2.5" opacity=".55" stroke-linecap="round"/>
      </g>

      <!-- 喙：上颌（压在喉囊上缘） -->
      <path d="M446 124 C514 124 574 144 601 165 C572 156 512 148 449 151 Z"
            fill="url(#beakGrad)" stroke="#dd8a1e" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M458 132 C514 133 564 148 590 162" fill="none" stroke="#ffd68c"
            stroke-width="2.5" opacity=".6" stroke-linecap="round"/>
      <path d="M449 151 C512 148 572 156 601 165" fill="none" stroke="#c9750f"
            stroke-width="2.5" opacity=".45" stroke-linecap="round"/>
      <!-- 鼻孔 -->
      <ellipse cx="478" cy="139" rx="5" ry="2.4" fill="#c9750f" opacity=".45" transform="rotate(6 478 139)"/>
      <!-- 喙尖小钩 -->
      <path d="M593 160 C603 164 605 174 596 179 C601 170 597 165 590 163 Z" fill="#d9821c"/>

      <!-- 眼睛 -->
      <g class="blink">
        <circle cx="440" cy="138" r="8.5" fill="#ffffff" stroke="#cdd9e0" stroke-width="1.5"/>
        <circle cx="442" cy="138" r="4.6" fill="#2b3440"/>
        <circle cx="444" cy="136" r="1.7" fill="#ffffff"/>
      </g>
    </g>

    <!-- 近侧翅膀：抓着车把 -->
    <g class="wing">
      <path d="M366 184 C414 188 462 208 502 236 C510 258 480 278 448 264 C408 248 366 222 350 192 Z"
            fill="#ffffff" stroke="#c6d6e0" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M382 208 C418 222 452 238 480 254" fill="none" stroke="#e2ebf1" stroke-width="3" stroke-linecap="round"/>
      <path d="M394 228 C424 240 450 252 470 262" fill="none" stroke="#e2ebf1" stroke-width="3" stroke-linecap="round"/>
      <path d="M374 192 C400 204 426 216 448 230" fill="none" stroke="#f6fafc" stroke-width="4.5" stroke-linecap="round"/>
      <!-- 翼尖包住车把 -->
      <path d="M490 230 C512 234 514 256 492 264 C500 252 496 240 484 240 Z"
            fill="#eef5f8" stroke="#c6d6e0" stroke-width="2"/>
    </g>
  </g>
</svg>
</div>
</body>
</html>
