<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕骑车 · Pelican on a Bicycle</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    padding: 24px;
    background:
      radial-gradient(120% 80% at 50% -10%, #fbfcf8 0%, #eceee7 46%, #e1e4dc 100%);
    font-family: ui-sans-serif, -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: #2c2a26;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    width: min(96vw, 1040px);
    display: flex; flex-direction: column; gap: 14px;
  }
  .stage {
    position: relative;
    aspect-ratio: 900 / 560;
    border-radius: 24px;
    overflow: hidden;
    background: #d5ecf7;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.85),
      0 28px 54px -24px rgba(36,42,46,.45),
      0 0 0 1px rgba(40,46,48,.09);
  }
  svg#scene { display: block; width: 100%; height: 100%; }

  .hud {
    display: flex; align-items: center; gap: 14px;
    padding: 0 6px;
    font-size: 13px; letter-spacing: .02em;
    color: #5c5952;
  }
  .hud label { font-weight: 600; color: #43413b; }
  .hud input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: min(38vw, 260px); height: 4px; border-radius: 4px;
    background: linear-gradient(90deg, #3d5a80 0%, #8fb0c8 100%);
    outline: none; cursor: pointer;
  }
  .hud input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 15px; height: 15px; border-radius: 50%;
    background: #fff; border: 3px solid #3d5a80;
    box-shadow: 0 2px 6px rgba(40,60,80,.28);
    transition: transform .15s;
  }
  .hud input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.12); }
  .hud input[type="range"]::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%;
    background: #fff; border: 3px solid #3d5a80;
  }
  .hud output {
    font-variant-numeric: tabular-nums;
    min-width: 58px; color: #3d5a80; font-weight: 600;
  }
  .hint { margin-left: auto; font-size: 12px; color: #8a867c; }

  /* 眨眼 */
  #eyeGroup {
    transform-box: view-box;
    transform-origin: 478px 81px;
    animation: blink 5.6s infinite;
  }
  @keyframes blink {
    0%, 91%, 100% { transform: scaleY(1); }
    94%, 96%     { transform: scaleY(.1); }
  }

  @media (max-width: 640px) {
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    #eyeGroup { animation: none; }
  }
</style>
</head>
<body>

<script>
(function () {
  const $ = (id) => document.getElementById(id);

  /* ---------- 几何常量 ---------- */
  const CK = { x: 450, y: 398 };   // 五通（曲柄中心）
  const CRANK_R = 52;              // 曲柄长度
  const HIP = { x: 400, y: 288 };  // 髋关节
  const L1 = 101, L2 = 72;         // 大腿 / 小腿
  const CRANK_W = 4.2;             // 曲柄角速度 rad/s
  const GEAR = 2.2;                // 传动比

  /* ---------- 元素 ---------- */
  const wheelB = $('wheelB'), wheelF = $('wheelF');
  const crankNear = $('crankNear'), crankFar = $('crankFar');
  const pedalNear = $('pedalNear'), pedalFar = $('pedalFar');
  const footNear = $('footNear'), footFar = $('footFar');
  const legNearPath = $('legNearPath'), legFarPath = $('legFarPath');
  const bob = $('bob'), headGroup = $('headGroup'), wingGroup = $('wingGroup');
  const cloudScroll = $('cloudScroll'), groundScroll = $('groundScroll'), poleScroll = $('poleScroll');
  const rpmOut = $('rpm'), speedInput = $('speed');

  /* ---------- 两段式 IK：给定髋与脚，求膝 ---------- */
  function solveLeg(hip, foot, l1, l2) {
    let dx = foot.x - hip.x, dy = foot.y - hip.y;
    let d = Math.hypot(dx, dy) || 0.0001;
    const maxD = l1 + l2 - 0.01;
    const minD = Math.abs(l1 - l2) + 0.01;
    d = Math.max(minD, Math.min(maxD, d));

    const ang = Math.atan2(dy, dx);
    const cosA = (d * d + l1 * l1 - l2 * l2) / (2 * d * l1);
    const A = Math.acos(Math.max(-1, Math.min(1, cosA)));

    // 膝盖朝前：取 ang - A
    const ka = ang - A;
    const knee = { x: hip.x + l1 * Math.cos(ka), y: hip.y + l1 * Math.sin(ka) };
    const end = { x: hip.x + d * Math.cos(ang), y: hip.y + d * Math.sin(ang) };

    return {
      foot: end,
      d: 'M ' + hip.x.toFixed(1) + ' ' + hip.y.toFixed(1) +
         ' L ' + knee.x.toFixed(1) + ' ' + knee.y.toFixed(1) +
         ' L ' + end.x.toFixed(1) + ' ' + end.y.toFixed(1)
    };
  }

  const rot = (el, deg, cx, cy) =>
    el.setAttribute('transform', 'rotate(' + deg.toFixed(2) + ' ' + cx + ' ' + cy + ')');

  /* ---------- 主循环 ---------- */
  let t = 0, speed = 1, paused = false, last = performance.now();

  function render(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (!paused) t += dt * speed;

    const a = t * CRANK_W;
    const ca = Math.cos(a), sa = Math.sin(a);

    /* 轮子 / 曲柄 */
    rot(wheelB, a * GEAR * 57.2958, 300, 398);
    rot(wheelF, a * GEAR * 57.2958, 610, 398);
    rot(crankNear, a * 57.2958, 450, 398);
    rot(crankFar,  a * 57.2958, 450, 398);

    /* 身体起伏 */
    const bobY = -3.2 * Math.sin(2 * a);
    const bobX = 1.6 * Math.sin(2 * a + 0.7);
    bob.setAttribute('transform', 'translate(' + bobX.toFixed(2) + ' ' + bobY.toFixed(2) + ')');

    /* 头 / 翅膀 */
    const nod = 2.0 * Math.sin(2 * a - 0.55);
    headGroup.setAttribute('transform', 'rotate(' + nod.toFixed(2) + ' 400 168)');
    wingGroup.setAttribute('transform', 'rotate(' + (nod * 0.5).toFixed(2) + ' 386 176)');

    /* 踏板位置 */
    const pN = { x: CK.x + CRANK_R * ca, y: CK.y + CRANK_R * sa };
    const pF = { x: CK.x - CRANK_R * ca, y: CK.y - CRANK_R * sa };

    pedalNear.setAttribute('transform', 'translate(' + pN.x.toFixed(1) + ' ' + pN.y.toFixed(1) + ')');
    pedalFar.setAttribute('transform',  'translate(' + pF.x.toFixed(1) + ' ' + pF.y.toFixed(1) + ')');
    footNear.setAttribute('transform',  'translate(' + pN.x.toFixed(1) + ' ' + pN.y.toFixed(1) + ')');
    footFar.setAttribute('transform',   'translate(' + pF.x.toFixed(1) + ' ' + pF.y.toFixed(1) + ')');

    /* 腿：髋随身体起伏 */
    const hip = { x: HIP.x + bobX, y: HIP.y + bobY };
    const legN = solveLeg(hip, { x: pN.x, y: pN.y - 4 }, L1, L2);
    const legF = solveLeg(hip, { x: pF.x, y: pF.y - 4 }, L1, L2);
    legNearPath.setAttribute('d', legN.d);
    legFarPath.setAttribute('d', legF.d);

    /* 背景视差滚动 */
    const shift = (v, w) => (-(v % w)).toFixed(2);
    cloudScroll.setAttribute('transform', 'translate(' + shift(t * 42, 900) + ' 0)');
    poleScroll.setAttribute('transform',  'translate(' + shift(t * 300, 900) + ' 0)');
    groundScroll.setAttribute('transform','translate(' + shift(t * 620, 900) + ' 0)');

    /* 读数 */
    rpmOut.textContent = Math.round(CRANK_W * speed * 60 / (2 * Math.PI)) + ' rpm';

    requestAnimationFrame(render);
  }

  /* ---------- 交互 ---------- */
  speedInput.addEventListener('input', () => {
    speed = Number(speedInput.value) / 100;
  });
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      paused = !paused;
    }
  });

  requestAnimationFrame(render);
})();
</script>
</body>
</html>
