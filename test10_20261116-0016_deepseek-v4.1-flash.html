<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG 动画</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #f6fafd 0%, #e4ecf2 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  svg {
    display: block;
    width: min(1120px, 94vw);
    height: auto;
    border-radius: 22px;
    box-shadow: 0 26px 64px -20px rgba(45, 70, 90, .38),
                0 0 0 1px rgba(255, 255, 255, .7);
  }

  /* ================= 背景视差滚动 ================= */
  @keyframes drift900 { to { transform: translateX(-900px); } }
  @keyframes drift360 { to { transform: translateX(-360px); } }
  @keyframes dashmove { to { stroke-dashoffset: -360; } }

  .clouds  { animation: drift900 52s linear infinite; }
  .hills   { animation: drift900 70s linear infinite; }
  .trees   { animation: drift360 1.176s linear infinite; }
  .road-dash {
    stroke-dasharray: 70 50;
    animation: dashmove 1.176s linear infinite;
  }

  /* ================= 眨眼 ================= */
  @keyframes blink {
    0%, 90%, 100% { transform: scaleY(1); }
    94%           { transform: scaleY(.08); }
  }
  .eye {
    animation: blink 4.6s infinite;
    transform-box: fill-box;
    transform-origin: center;
  }

  /* ================= 喉囊晃动 ================= */
  @keyframes pouchwobble {
    0%, 100% { transform: scaleY(1) translateY(0); }
    50%      { transform: scaleY(1.09) translateY(1.5px); }
  }
  .pouch {
    animation: pouchwobble .8s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 50% 0%;
  }

  /* ================= 冠羽抖动 ================= */
  @keyframes crestsway {
    0%, 100% { transform: rotate(-3deg); }
    50%      { transform: rotate(4deg); }
  }
  .crest {
    animation: crestsway .8s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 100% 100%;
  }

  /* ================= 尾羽摆动 ================= */
  @keyframes tailsway {
    0%, 100% { transform: rotate(-2.5deg); }
    50%      { transform: rotate(3deg); }
  }
  .tail {
    animation: tailsway 1.6s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 100% 40%;
  }

  /* ================= 后轮尘土 ================= */
  @keyframes dustpuff {
    0%   { opacity: .55; transform: translate(0, 0) scale(.45); }
    100% { opacity: 0;   transform: translate(-58px, -18px) scale(1.7); }
  }
  .dust {
    animation: dustpuff 1.4s ease-out infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  .dust.d2 { animation-delay: .46s; }
  .dust.d3 { animation-delay: .92s; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0s !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕骑着自行车的二维动画">

  <!-- 牙盘 + 链条 -->

  <path d="M295,363 L410,394" fill="none" stroke="#8b979e" stroke-width="3.5" stroke-dasharray="5 3"/>
  <circle cx="410" cy="368" r="26" fill="none" stroke="#9aa8b0" stroke-width="4"/>

  <g id="pedalNear" transform="translate(410,320)">

  <!-- 近侧腿 + 脚 -->

  <path id="legNear" d="M352,264 L400,300 L420,340" fill="none"

  <g id="footNear" transform="translate(420,340)">

    <path d="M-7,-3 L10,-1 L15,8" fill="none" stroke="#e89a3c" stroke-width="8"

  <!-- 尘土 -->

  <!-- ==================== 鹈鹕 ==================== -->

      <path d="M282,206 L238,192" fill="none" stroke="#ded7c7" stroke-width="2"/>

    <!-- 身体 -->

<script>
(function () {
  'use strict';

  const $ = function (id) { return document.getElementById(id); };

  /* ---- 几何常量（与 SVG 坐标系一致） ---- */
  const BB        = { x: 410, y: 368 };   // 五通（曲柄轴）
  const CRANK_LEN = 48;                   // 曲柄长度
  const THIGH     = 70;                   // 大腿
  const SHIN      = 76;                   // 小腿
  const HIP_NEAR  = { x: 352, y: 264 };
  const HIP_FAR   = { x: 342, y: 258 };

  const CRANK_PERIOD = 800;   // 曲柄一圈 0.8s（≈75rpm）
  const WHEEL_PERIOD = 1600;  // 轮子一圈 1.6s（齿比 1:2）

  const el = {
    wheelRear:  $('wheelRear'),
    wheelFront: $('wheelFront'),
    crankNear:  $('crankNear'),
    crankFar:   $('crankFar'),
    pedalNear:  $('pedalNear'),
    pedalFar:   $('pedalFar'),
    legNear:    $('legNear'),
    legFar:     $('legFar'),
    legNearEdge: $('legNearEdge'),
    legFarEdge:  $('legFarEdge'),
    footNear:   $('footNear'),
    footFar:    $('footFar'),
    pelican:    $('pelican'),
    head:       $('headGroup')
  };

  /* ---- 两段式反向运动学：由髋与踝求膝盖 ---- */
  function solveKnee(hip, ankle) {
    const dx = ankle.x - hip.x;
    const dy = ankle.y - hip.y;
    let d = Math.sqrt(dx * dx + dy * dy);
    const maxD = THIGH + SHIN - 1.5;
    if (d > maxD) d = maxD;
    if (d < 1) d = 1;

    const base = Math.atan2(dy, dx);
    const cosA = (THIGH * THIGH + d * d - SHIN * SHIN) / (2 * THIGH * d);
    const a = Math.acos(Math.max(-1, Math.min(1, cosA)));

    // 减号 → 膝关节向前弯（鸟类骑行的姿态）
    const ang = base - a;
    return {
      x: hip.x + THIGH * Math.cos(ang),
      y: hip.y + THIGH * Math.sin(ang)
    };
  }

  function frame(now) {
    const t = now;

    /* 曲柄相位 */
    const theta = ((t % CRANK_PERIOD) / CRANK_PERIOD) * Math.PI * 2;

    /* 车轮：与曲柄同步，1:2 */
    const wheelDeg = ((t % WHEEL_PERIOD) / WHEEL_PERIOD) * 360;
    el.wheelRear.setAttribute('transform',  'rotate(' + wheelDeg + ' 295 352)');
    el.wheelFront.setAttribute('transform', 'rotate(' + wheelDeg + ' 605 352)');

    /* 两个踏板位置（相差 180°） */
    const cx = Math.cos(theta) * CRANK_LEN;
    const cy = Math.sin(theta) * CRANK_LEN;
    const near = { x: BB.x + cx, y: BB.y + cy };
    const far  = { x: BB.x - cx, y: BB.y - cy };

    el.crankNear.setAttribute('x2', near.x);
    el.crankNear.setAttribute('y2', near.y);
    el.crankFar.setAttribute('x2', far.x);
    el.crankFar.setAttribute('y2', far.y);

    el.pedalNear.setAttribute('transform', 'translate(' + near.x + ' ' + near.y + ')');
    el.pedalFar.setAttribute('transform',  'translate(' + far.x  + ' ' + far.y  + ')');

    /* 身体随踩踏起伏（每半圈一次蹬踏力） */
    const bob = Math.sin(theta * 2) * 2.2;

    /* 腿：踝点落在踏板上方 */
    const hipN = { x: HIP_NEAR.x, y: HIP_NEAR.y + bob };
    const hipF = { x: HIP_FAR.x,  y: HIP_FAR.y  + bob };
    const ankN = { x: near.x - 2, y: near.y - 10 };
    const ankF = { x: far.x  - 2, y: far.y  - 10 };

    const kN = solveKnee(hipN, ankN);
    const kF = solveKnee(hipF, ankF);

    const dNear = 'M' + hipN.x + ',' + hipN.y + ' L' + kN.x + ',' + kN.y + ' L' + ankN.x + ',' + ankN.y;
    const dFar  = 'M' + hipF.x + ',' + hipF.y + ' L' + kF.x + ',' + kF.y + ' L' + ankF.x + ',' + ankF.y;

    el.legNear.setAttribute('d', dNear);
    el.legNearEdge.setAttribute('d', dNear);
    el.legFar.setAttribute('d', dFar);
    el.legFarEdge.setAttribute('d', dFar);

    el.footNear.setAttribute('transform', 'translate(' + ankN.x + ' ' + ankN.y + ')');
    el.footFar.setAttribute('transform',  'translate(' + ankF.x + ' ' + ankF.y + ')');

    /* 整体上下浮动 */
    el.pelican.setAttribute('transform', 'translate(0 ' + bob.toFixed(2) + ')');

    /* 头部轻微点头 */
    const tilt = Math.sin(theta * 2 + 0.7) * 1.8;
    el.head.setAttribute('transform', 'rotate(' + tilt.toFixed(2) + ' 484 120)');

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
