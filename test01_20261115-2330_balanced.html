<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车 · SVG 动画</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(#aee3f7 0%, #d9f0fa 55%, #f7e8b0 55%, #f2d98d 100%);
    font-family: "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }

  h1 {
    margin-bottom: 8px;
    color: #2b4a5e;
    font-size: 20px;
    letter-spacing: 2px;
  }

  .stage {
    width: min(90vw, 900px);
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0,0,0,.18);
    overflow: hidden;
  }

  /* ---------- 动画定义 ---------- */

  /* 车轮旋转 */
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 曲柄 + 脚蹬旋转 */
  @keyframes crank { to { transform: rotate(-360deg); } }

  /* 腿部随脚蹬摆动 */
  @keyframes legFront {
    0%   { transform: rotate(38deg); }
    50%  { transform: rotate(12deg); }
    100% { transform: rotate(38deg); }
  }
  @keyframes legBack {
    0%   { transform: rotate(14deg); }
    50%  { transform: rotate(40deg); }
    100% { transform: rotate(14deg); }
  }
  @keyframes footFront {
    0%   { transform: translate(-22px, 16px); }
    50%  { transform: translate(22px, -14px); }
    100% { transform: translate(-22px, 16px); }
  }
  @keyframes footBack {
    0%   { transform: translate(22px, -14px); }
    50%  { transform: translate(-22px, 16px); }
    100% { transform: translate(22px, -14px); }
  }

  /* 身体上下起伏 */
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }

  /* 翅膀扇动 */
  @keyframes flap {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-16deg); }
  }

  /* 喉囊晃动 */
  @keyframes pouch {
    0%, 100% { transform: rotate(0deg) scaleY(1); }
    25%      { transform: rotate(2deg) scaleY(1.04); }
    75%      { transform: rotate(-2deg) scaleY(.96); }
  }

  /* 地面滚动的草 */
  @keyframes scroll { to { transform: translateX(-120px); } }

  /* 云朵飘 */
  @keyframes drift {
    from { transform: translateX(960px); }
    to   { transform: translateX(-260px); }
  }

  /* 尾羽摆动 */
  @keyframes tail {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-6deg); }
  }

  /* ---------- 应用动画 ---------- */
  .wheel      { transform-box: fill-box; transform-origin: center; animation: spin 1s linear infinite; }
  .wheel-back { animation-duration: 1s; }
  .crank-group{ transform-box: fill-box; transform-origin: center; animation: crank 1s linear infinite; }

  .rider      { animation: bob 0.5s ease-in-out infinite; }
  .wing       { transform-box: fill-box; transform-origin: 60% 20%; animation: flap 0.5s ease-in-out infinite; }
  .pouch      { transform-box: fill-box; transform-origin: 10% 10%; animation: pouch 0.5s ease-in-out infinite; }
  .tail       { transform-box: fill-box; transform-origin: 0% 50%; animation: tail 0.5s ease-in-out infinite; }

  .leg-front  { transform-box: fill-box; transform-origin: 50% 4%; animation: legFront 0.5s linear infinite; }
  .leg-back   { transform-box: fill-box; transform-origin: 50% 4%; animation: legBack  0.5s linear infinite; }

  .grass      { animation: scroll .6s linear infinite; }
  .cloud1     { animation: drift 26s linear infinite; }
  .cloud2     { animation: drift 38s linear infinite 6s; }
  .cloud3     { animation: drift 50s linear infinite 14s; }

  .speed-line { animation: scroll .35s linear infinite; }

  svg { display: block; width: 100%; height: auto; background: linear-gradient(#b8e4f8, #e6f6ff 70%, #e6f6ff); }
</style>
</head>
<body>

<h1>🚲 鹈鹕兜风中</h1>

<div class="stage">
<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">

  <!-- ===== 背景：太阳 ===== -->
  <circle cx="790" cy="80" r="46" fill="#ffd75e"/>
  <g stroke="#ffd75e" stroke-width="6" stroke-linecap="round">
    <line x1="790" y1="14" x2="790" y2="30"/>
    <line x1="790" y1="130" x2="790" y2="146"/>
    <line x1="724" y1="80" x2="740" y2="80"/>
    <line x1="840" y1="80" x2="856" y2="80"/>
    <line x1="743" y1="33" x2="754" y2="44"/>
    <line x1="826" y1="116" x2="837" y2="127"/>
    <line x1="743" y1="127" x2="754" y2="116"/>
    <line x1="826" y1="44" x2="837" y2="33"/>
  </g>

  <!-- ===== 云朵 ===== -->
  <g class="cloud1" fill="#ffffff" opacity=".9">
    <ellipse cx="120" cy="70" rx="46" ry="18"/>
    <ellipse cx="155" cy="58" rx="30" ry="16"/>
    <ellipse cx="90"  cy="60" rx="24" ry="13"/>
  </g>
  <g class="cloud2" fill="#ffffff" opacity=".75">
    <ellipse cx="320" cy="120" rx="38" ry="14"/>
    <ellipse cx="350" cy="108" rx="24" ry="13"/>
  </g>
  <g class="cloud3" fill="#ffffff" opacity=".6">
    <ellipse cx="560" cy="55" rx="34" ry="13"/>
    <ellipse cx="588" cy="45" rx="22" ry="11"/>
  </g>

  <!-- ===== 远山 ===== -->
  <path d="M0 330 Q 150 250 300 330 T 600 330 T 900 330 V400 H0 Z" fill="#a8d5a2" opacity=".7"/>
  <path d="M0 355 Q 220 300 450 355 T 900 350 V420 H0 Z" fill="#b9e0a5" opacity=".8"/>

  <!-- ===== 地面 ===== -->
  <rect x="0" y="398" width="900" height="102" fill="#e8c96f"/>
  <rect x="0" y="398" width="900" height="8" fill="#d4a94e"/>

  <!-- 滚动的草地 -->
  <g class="grass" fill="#7cbf5f">
    <g id="grassStrip">
      <path d="M20 400 q2 -12 4 0 q2 -10 4 0 q2 -8 4 0" stroke="#6aab4e" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M120 400 q2 -10 4 0 q2 -8 4 0" stroke="#6aab4e" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M250 400 q2 -13 4 0 q2 -9 4 0 q2 -7 4 0" stroke="#6aab4e" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M380 400 q2 -11 4 0 q2 -8 4 0" stroke="#6aab4e" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M520 400 q2 -12 4 0 q2 -8 4 0 q2 -6 4 0" stroke="#6aab4e" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M650 400 q2 -9 4 0 q2 -7 4 0" stroke="#6aab4e" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M790 400 q2 -12 4 0 q2 -9 4 0" stroke="#6aab4e" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
    <use href="#grassStrip" x="120" y="0"/>
  </g>

  <!-- ===== 速度线 ===== -->
  <g class="speed-line" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".8">
    <g id="sl">
      <line x1="60"  y1="330" x2="115" y2="330"/>
      <line x1="35"  y1="352" x2="75"  y2="352"/>
      <line x1="80"  y1="300" x2="120" y2="300"/>
    </g>
    <use href="#sl" x="150" y="0"/>
    <use href="#sl" x="300" y="0"/>
    <use href="#sl" x="450" y="0"/>
    <use href="#sl" x="600" y="0"/>
    <use href="#sl" x="750" y="0"/>
  </g>

  <!-- ===================================================== -->
  <!-- 骑手 + 自行车（整体固定，内部部件动画） -->
  <!-- ===================================================== -->
  <g transform="translate(0,0)">

    <!-- 后腿（远侧，深色，画在车架后面） -->
    <g class="leg-back">
      <path d="M432 248 L448 292 L436 330" fill="none" stroke="#e0912f" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g class="footBack-wrap">
      <ellipse cx="436" cy="334" rx="17" ry="9" fill="#e0912f">
      </ellipse>
    </g>

    <!-- ===== 自行车 ===== -->
    <!-- 后轮 -->
    <g class="wheel wheel-back" transform="translate(330,352)">
      <circle r="52" fill="none" stroke="#333" stroke-width="9"/>
      <g stroke="#555" stroke-width="3.5">
        <line x1="-48" y1="0" x2="48" y2="0"/>
        <line x1="0" y1="-48" x2="0" y2="48"/>
        <line x1="-34" y1="-34" x2="34" y2="34"/>
        <line x1="-34" y1="34" x2="34" y2="-34"/>
        <line x1="-46" y1="-16" x2="46" y2="16"/>
        <line x1="46" y1="-16" x2="-46" y2="16"/>
      </g>
      <circle r="8" fill="#888"/>
    </g>

    <!-- 前轮 -->
    <g class="wheel" transform="translate(560,352)">
      <circle r="52" fill="none" stroke="#333" stroke-width="9"/>
      <g stroke="#555" stroke-width="3.5">
        <line x1="-48" y1="0" x2="48" y2="0"/>
        <line x1="0" y1="-48" x2="0" y2="48"/>
        <line x1="-34" y1="-34" x2="34" y2="34"/>
        <line x1="-34" y1="34" x2="34" y2="-34"/>
        <line x1="-46" y1="-16" x2="46" y2="16"/>
        <line x1="46" y1="-16" x2="-46" y2="16"/>
      </g>
      <circle r="8" fill="#888"/>
    </g>

    <!-- 车架 -->
    <g stroke="#e2574c" stroke-width="10" stroke-linecap="round" fill="none">
      <line x1="330" y1="352" x2="435" y2="290"/>   <!-- 后叉上 -->
      <line x1="330" y1="352" x2="438" y2="345"/>   <!-- 后叉下 -->
      <line x1="435" y1="290" x2="560" y2="352"/>   <!-- 上管（座→头） -->
      <line x1="438" y1="345" x2="490" y2="300"/>   <!-- 下管 -->
      <line x1="490" y1="300" x2="560" y2="352"/>   <!-- 前叉下 -->
      <line x1="490" y1="300" x2="505" y2="272"/>   <!-- 头管 -->
    </g>

    <!-- 齿盘 -->
    <circle cx="438" cy="347" r="20" fill="#444"/>
    <circle cx="438" cy="347" r="13" fill="#666"/>
    <!-- 链条 -->
    <line x1="438" y1="327" x2="560" y2="306" stroke="#222" stroke-width="4"/>
    <line x1="438" y1="366" x2="556" y2="392" stroke="#222" stroke-width="4"/>

    <!-- 车把 -->
    <path d="M505 272 L520 258" stroke="#e2574c" stroke-width="9" stroke-linecap="round"/>
    <path d="M520 258 q22 -14 30 2" stroke="#e2574c" stroke-width="9" fill="none" stroke-linecap="round"/>
    <circle cx="552" cy="262" r="7" fill="#333"/>

    <!-- 车座 -->
    <path d="M414 272 q26 -14 46 0 q-22 10 -46 0 Z" fill="#5a3b2e"/>

    <!-- 曲柄与脚蹬（近侧一组旋转） -->
    <g class="crank-group" transform="translate(438,347)">
      <line x1="0" y1="0" x2="0" y2="26" stroke="#999" stroke-width="6" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="0" y2="-26" stroke="#777" stroke-width="6" stroke-linecap="round"/>
      <rect x="-14" y="20" width="28" height="8" rx="4" fill="#222"/>
      <rect x="-14" y="-28" width="28" height="8" rx="4" fill="#222"/>
    </g>

    <!-- ===== 鹈鹕骑手 ===== -->
    <g class="rider">

      <!-- 尾羽 -->
      <g class="tail">
        <path d="M435 246 q-40 -18 -52 -6 q10 16 52 22 Z" fill="#f2ede4"/>
      </g>

      <!-- 身体 -->
      <ellipse cx="452" cy="230" rx="58" ry="44" fill="#faf6ee"/>
      <ellipse cx="452" cy="230" rx="58" ry="44" fill="none" stroke="#d8d0c0" stroke-width="2"/>

      <!-- 翅膀（握在车把上） -->
      <g class="wing">
        <path d="M462 215 q55 5 92 42 q-8 8 -20 2 q2 10 -8 10 q-30 -8 -66 -34 Z"
              fill="#f0e9da" stroke="#d8d0c0" stroke-width="2"/>
        <line x1="470" y1="222" x2="540" y2="256" stroke="#d8d0c0" stroke-width="2"/>
        <line x1="478" y1="232" x2="540" y2="262" stroke="#d8d0c0" stroke-width="2"/>
      </g>
      <!-- 翅尖搭到车把 -->
      <circle cx="546" cy="258" r="5" fill="#e8e0cf"/>

      <!-- 头颈 -->
      <path d="M478 200 q18 -40 44 -46 q26 -4 34 16 q6 18 -8 26 q14 -2 16 10 q2 12 -12 14
               q-4 14 -22 14 q-18 0 -30 -8 q-14 8 -22 -12 Z"
            fill="#faf6ee" stroke="#d8d0c0" stroke-width="2"/>
      <!-- 头顶翘毛 -->
      <path d="M540 152 q-4 -16 6 -22 q6 8 2 22 Z" fill="#faf6ee" stroke="#d8d0c0" stroke-width="2"/>

      <!-- 眼睛 -->
      <circle cx="545" cy="170" r="6" fill="#fff"/>
      <circle cx="546" cy="170" r="3" fill="#222"/>
      <circle cx="547" cy="169" r="1" fill="#fff"/>

      <!-- 大嘴上喙 -->
      <path d="M556 168 L688 186 L556 182 Z" fill="#f5a623"/>
      <!-- 喉囊（带动画） -->
      <g class="pouch">
        <path d="M556 182 Q 640 210 686 186 Q 630 240 566 200 Z" fill="#ffb940"/>
      </g>
      <!-- 嘴角小翘 -->
      <path d="M676 184 q10 -2 14 4" stroke="#f5a623" stroke-width="3" fill="none" stroke-linecap="round"/>

      <!-- 前腿（近侧，画在身前） -->
      <g class="leg-front">
        <path d="M438 246 L452 292 L440 330" fill="none" stroke="#f5a623" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g class="footFront-wrap">
        <ellipse cx="440" cy="334" rx="18" ry="9" fill="#f5a623"/>
      </g>

      <!-- 蹬车戴的小围巾 -->
      <path d="M496 196 q18 8 20 24 l-14 -6 l-2 16 l-12 -12 Z" fill="#e2574c"/>
      <path d="M500 214 q-4 26 -22 34 l-2 -14 q10 -8 12 -22 Z" fill="#e2574c"/>

    </g><!-- /.rider -->
  </g>

  <!-- ===== 飞过的小鸟 ===== -->
  <g class="cloud2" fill="none" stroke="#4a7a94" stroke-width="3" stroke-linecap="round">
    <path d="M700 90 q6 -8 12 0 q6 -8 12 0"/>
    <path d="M740 70 q5 -7 10 0 q5 -7 10 0"/>
  </g>

</svg>
</div>

<p style="margin-top:14px;color:#2b4a5e;font-size:13px;opacity:.8">
  纯 SVG + CSS 动画 · 车轮 / 脚蹬 / 双腿 / 翅膀 / 喉囊 / 云和草地全在动
</p>

</body>
</html>
