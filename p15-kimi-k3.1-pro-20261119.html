<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3efe5">
  <title>鹈鹕的海岸骑行 · SVG 动画</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #183f3b;
      --muted: #6c7e73;
      --paper: #f3efe5;
      --card: #fffaf0;
      --coral: #ed8062;
      --teal: #28746e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(circle at 12% 12%, rgba(255, 255, 255, .9), transparent 30%),
        radial-gradient(circle at 88% 88%, rgba(231, 177, 132, .16), transparent 34%),
        var(--paper);
      color: var(--ink);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    button { font: inherit; }

    .page {
      width: min(1220px, 100%);
    }

    .heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin: 0 4px 18px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--coral);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 3.4vw, 42px);
      line-height: 1.15;
      letter-spacing: -.04em;
      font-weight: 800;
    }

    .heading-note {
      margin: 0 0 3px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .08em;
      white-space: nowrap;
    }

    .scene {
      --road-duration: 2.4s;
      --roadside-duration: 14s;
      --foreground-duration: 8s;
      --cloud-one-duration: 52s;
      --cloud-two-duration: 64s;
      --cloud-three-duration: 58s;
      --wave-duration: 5s;
      --scarf-duration: 2.4s;
      --dust-duration: 1.5s;
      overflow: hidden;
      border: 1px solid rgba(24, 63, 59, .12);
      border-radius: 28px;
      background: var(--card);
      box-shadow:
        0 28px 70px rgba(61, 70, 53, .12),
        0 3px 10px rgba(61, 70, 53, .05);
    }

    .art-wrap {
      position: relative;
      overflow: hidden;
      background: #f7e6cd;
    }

    #art {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
    }

    .scene-badge {
      position: absolute;
      top: 20px;
      left: 20px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid rgba(255, 255, 255, .5);
      border-radius: 999px;
      background: rgba(255, 250, 240, .68);
      box-shadow: 0 4px 16px rgba(24, 63, 59, .05);
      backdrop-filter: blur(8px);
      color: #315b53;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #e98161;
      box-shadow: 0 0 0 4px rgba(233, 129, 97, .14);
    }

    .is-paused .status-dot {
      background: #87968d;
      box-shadow: 0 0 0 4px rgba(135, 150, 141, .14);
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 76px;
      padding: 15px 20px;
      border-top: 1px solid rgba(24, 63, 59, .1);
      background: rgba(255, 250, 240, .96);
    }

    .control-left,
    .control-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .play-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-width: 112px;
      padding: 11px 16px;
      border: 0;
      border-radius: 999px;
      background: var(--ink);
      color: #fffaf0;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      transition: transform .2s ease, background .2s ease;
    }

    .play-button:hover { background: #245750; transform: translateY(-1px); }
    .play-button:active { transform: translateY(0); }
    .play-button:focus-visible,
    .speed-button:focus-visible {
      outline: 3px solid rgba(237, 128, 98, .38);
      outline-offset: 3px;
    }

    .control-hint {
      color: var(--muted);
      font-size: 12px;
    }

    .speed-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
    }

    .speed-group {
      display: flex;
      gap: 3px;
      padding: 4px;
      border-radius: 999px;
      background: #eee9dd;
    }

    .speed-button {
      min-width: 48px;
      padding: 7px 10px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: #687b72;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      transition: background .2s ease, color .2s ease, box-shadow .2s ease;
    }

    .speed-button[aria-pressed="true"] {
      background: #fffaf0;
      color: var(--ink);
      box-shadow: 0 2px 7px rgba(24, 63, 59, .09);
    }

    .footer-note {
      margin: 15px 5px 0;
      color: #849087;
      font-size: 11px;
      letter-spacing: .08em;
      text-align: right;
    }

    /* SVG animations: scenery uses CSS; the bicycle and legs share one JS clock. */
    .wheel-rotor { will-change: transform; }

    .road-flow {
      animation: road-scroll var(--road-duration) linear infinite;
    }

    .roadside-strip {
      animation: roadside-scroll var(--roadside-duration) linear infinite;
    }

    .foreground-strip {
      animation: foreground-scroll var(--foreground-duration) linear infinite;
    }

    .cloud {
      animation-name: cloud-drift;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      will-change: transform;
    }

    .cloud-one {
      animation-duration: var(--cloud-one-duration);
      animation-delay: -18s;
    }

    .cloud-two {
      animation-duration: var(--cloud-two-duration);
      animation-delay: -39s;
    }

    .cloud-three {
      animation-duration: var(--cloud-three-duration);
      animation-delay: -8s;
    }

    .wave-line {
      animation: wave-slide var(--wave-duration) linear infinite;
    }

    .scarf-tail {
      transform-origin: 548px 225px;
      transform-box: view-box;
      animation: scarf-wave var(--scarf-duration) ease-in-out infinite;
    }

    .eye-blink {
      transform-origin: center;
      transform-box: fill-box;
      animation: blink 5.6s ease-in-out infinite;
    }

    .dust {
      opacity: 0;
      transform-origin: center;
      transform-box: fill-box;
      animation: dust-puff var(--dust-duration) linear infinite;
    }

    .dust-two { animation-delay: -.5s; }
    .dust-three { animation-delay: -1s; }

    .sun-ring {
      transform-origin: center;
      transform-box: fill-box;
      animation: sun-breathe 5s ease-in-out infinite;
    }

    .is-paused .road-flow,
    .is-paused .roadside-strip,
    .is-paused .foreground-strip,
    .is-paused .cloud,
    .is-paused .wave-line,
    .is-paused .scarf-tail,
    .is-paused .eye-blink,
    .is-paused .dust,
    .is-paused .sun-ring {
      animation-play-state: paused;
    }

    @keyframes road-scroll {
      to { transform: translateX(-240px); }
    }

    @keyframes roadside-scroll {
      to { transform: translateX(-1280px); }
    }

    @keyframes foreground-scroll {
      to { transform: translateX(-1280px); }
    }

    @keyframes cloud-drift {
      from { transform: translateX(-420px); }
      to { transform: translateX(1500px); }
    }

    @keyframes wave-slide {
      to { stroke-dashoffset: -120px; }
    }

    @keyframes scarf-wave {
      0%, 100% { transform: rotate(-2deg) translateY(0); }
      50% { transform: rotate(4deg) translateY(-3px); }
    }

    @keyframes blink {
      0%, 89%, 93%, 100% { transform: scaleY(1); }
      91% { transform: scaleY(.12); }
    }

    @keyframes dust-puff {
      0% { opacity: 0; transform: translate(0, 0) scale(.45); }
      18% { opacity: .55; }
      100% { opacity: 0; transform: translate(-95px, -20px) scale(1.35); }
    }

    @keyframes sun-breathe {
      0%, 100% { opacity: .28; transform: scale(.96); }
      50% { opacity: .5; transform: scale(1.04); }
    }

    @media (max-width: 680px) {
      body { padding: 18px 12px; }
      .heading { align-items: flex-start; margin-bottom: 13px; }
      .heading-note, .control-hint, .speed-label { display: none; }
      .scene { border-radius: 20px; }
      .scene-badge { top: 12px; left: 12px; padding: 6px 10px; font-size: 9px; }
      .controls { min-height: 68px; padding: 12px; gap: 10px; }
      .control-left, .control-right { gap: 8px; }
      .play-button { min-width: 96px; padding: 10px 13px; }
      .speed-button { min-width: 41px; padding: 7px 8px; }
      .footer-note { text-align: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      .play-button, .speed-button { transition: none; }
    }
  </style>
</head>

      <div class="controls">
        <div class="control-left">
          <button class="play-button" id="toggle" type="button" aria-label="暂停动画">
            <svg width="15" height="15" viewBox="0 0 20 20" aria-hidden="true">
              <path id="toggle-icon" d="M5 3H9V17H5ZM12 3H16V17H12Z" fill="currentColor"/>
            </svg>
            <span id="toggle-text">暂停动画</span>
          </button>
          <span class="control-hint">车轮、踏板与双腿保持同步</span>
        </div>
        <div class="control-right">
          <span class="speed-label">骑行速度</span>
          <div class="speed-group" role="group" aria-label="动画速度">
            <button class="speed-button" type="button" data-speed="0.5" aria-pressed="false">0.5×</button>
            <button class="speed-button" type="button" data-speed="1" aria-pressed="true">1×</button>
            <button class="speed-button" type="button" data-speed="1.5" aria-pressed="false">1.5×</button>
          </div>
        </div>
      </div>
    </section>

    <p class="footer-note">纯 SVG 绘制 · 无外部资源 · 支持减少动态效果偏好</p>
  </main>

  <script>
    (() => {
      const scene = document.getElementById('scene');
      const toggle = document.getElementById('toggle');
      const toggleText = document.getElementById('toggle-text');
      const toggleIcon = document.getElementById('toggle-icon');
      const statusText = document.getElementById('status-text');
      const speedButtons = Array.from(document.querySelectorAll('[data-speed]'));
      const wheelRotors = Array.from(document.querySelectorAll('.wheel-rotor'));
      const pelican = document.getElementById('pelican');
      const crank = document.getElementById('crank-rotor');
      const nearLeg = document.getElementById('leg-near');
      const farLeg = document.getElementById('leg-far');
      const nearFoot = document.getElementById('foot-near');
      const farFoot = document.getElementById('foot-far');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

      const cycleSeconds = 1.2;
      const crankCenter = { x: 578, y: 542 };
      const crankRadius = 34;
      let phase = 0;
      let speed = 1;
      let playing = !reducedMotion.matches;
      let lastTime = performance.now();

      function setPlaying(next) {
        playing = next;
        scene.classList.toggle('is-paused', !playing);
        toggleText.textContent = playing ? '暂停动画' : '播放动画';
        toggle.setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
        toggleIcon.setAttribute('d', playing ? 'M5 3H9V17H5ZM12 3H16V17H12Z' : 'M6 3L17 10L6 17Z');
        statusText.textContent = playing ? '正在兜风' : '歇一会儿';
        lastTime = performance.now();
      }

      function setSpeed(nextSpeed) {
        speed = nextSpeed;
        const durations = {
          '--road-duration': 2.4,
          '--roadside-duration': 14,
          '--foreground-duration': 8,
          '--cloud-one-duration': 52,
          '--cloud-two-duration': 64,
          '--cloud-three-duration': 58,
          '--wave-duration': 5,
          '--scarf-duration': 2.4,
          '--dust-duration': 1.5
        };
        Object.entries(durations).forEach(([property, base]) => {
          scene.style.setProperty(property, `${base / speed}s`);
        });
        speedButtons.forEach((button) => {
          button.setAttribute('aria-pressed', String(Number(button.dataset.speed) === speed));
        });
      }

      // Two-bone inverse kinematics keeps each webbed foot on its pedal.
      function kneePosition(hip, foot) {
        const thigh = 110;
        const shin = 115;
        const dx = foot.x - hip.x;
        const dy = foot.y - hip.y;
        const distance = Math.max(1, Math.hypot(dx, dy));
        const ux = dx / distance;
        const uy = dy / distance;
        const along = (thigh * thigh - shin * shin + distance * distance) / (2 * distance);
        const height = Math.sqrt(Math.max(0, thigh * thigh - along * along));
        const baseX = hip.x + ux * along;
        const baseY = hip.y + uy * along;
        return {
          x: baseX + uy * height,
          y: baseY - ux * height
        };
      }

      function updateLeg(path, footGroup, hip, foot, rotation) {
        const knee = kneePosition(hip, foot);
        path.setAttribute('d', `M${hip.x.toFixed(1)} ${hip.y.toFixed(1)}L${knee.x.toFixed(1)} ${knee.y.toFixed(1)}L${foot.x.toFixed(1)} ${foot.y.toFixed(1)}`);
        footGroup.setAttribute('transform', `translate(${foot.x.toFixed(2)} ${foot.y.toFixed(2)}) rotate(${rotation.toFixed(2)})`);
      }

      function render() {
        const radians = phase * Math.PI * 2;
        const degrees = phase * 360;
        const bob = Math.sin(radians * 2) * 2.2;

        wheelRotors.forEach((wheel) => {
          wheel.setAttribute('transform', `rotate(${degrees.toFixed(2)})`);
        });
        crank.setAttribute('transform', `rotate(${degrees.toFixed(2)} ${crankCenter.x} ${crankCenter.y})`);
        pelican.setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);

        const nearPedal = {
          x: crankCenter.x + Math.cos(radians) * crankRadius,
          y: crankCenter.y + Math.sin(radians) * crankRadius
        };
        const farPedal = {
          x: crankCenter.x - Math.cos(radians) * crankRadius,
          y: crankCenter.y - Math.sin(radians) * crankRadius
        };

        updateLeg(nearLeg, nearFoot, { x: 546, y: 378 + bob }, nearPedal, Math.sin(radians) * 6);
        updateLeg(farLeg, farFoot, { x: 508, y: 377 + bob }, farPedal, -Math.sin(radians) * 6);
      }

      function animate(now) {
        if (playing) {
          const delta = Math.min((now - lastTime) / 1000, 0.05);
          phase = (phase + delta * speed / cycleSeconds) % 1;
        }
        lastTime = now;
        render();
        requestAnimationFrame(animate);
      }

      toggle.addEventListener('click', () => setPlaying(!playing));
      speedButtons.forEach((button) => {
        button.addEventListener('click', () => setSpeed(Number(button.dataset.speed)));
      });
      document.addEventListener('visibilitychange', () => {
        lastTime = performance.now();
      });
      reducedMotion.addEventListener('change', (event) => {
        if (event.matches) setPlaying(false);
      });

      setSpeed(1);
      setPlaying(playing);
      render();
      requestAnimationFrame(animate);
    })();
  </script>
</body>
