<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>骑自行车的鹈鹕</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #f6fbff 0%, #e4f2ff 100%);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    color: #37474f;
  }
  .card {
    width: min(94vw, 920px);
    background: #ffffff;
    border-radius: 24px;
    padding: 14px 14px 18px;
    box-shadow: 0 18px 48px rgba(52, 96, 140, 0.16);
  }
  h1 {
    text-align: center;
    font-size: 21px;
    letter-spacing: 2px;
    margin: 4px 0 12px;
    color: #2b4a5e;
  }
  h1 small {
    display: block;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 1px;
    color: #8aa5b5;
    margin-top: 3px;
  }
  svg { display: block; width: 100%; height: auto; border-radius: 16px; }

  /* 云朵飘动 */
  .cloud { animation: drift 30s linear infinite; }
  .cloud.c2 { animation-duration: 42s; animation-delay: -12s; }
  .cloud.c3 { animation-duration: 24s; animation-delay: -20s; }
  @keyframes drift {
    from { transform: translateX(140px); }
    to   { transform: translateX(-950px); }
  }

  /* 路面标线向后移动，制造前进感 */
  .road-mark { animation: dash 0.6s linear infinite; }
  @keyframes dash {
    from { transform: translateX(0); }
    to   { transform: translateX(-80px); }
  }

  /* 围巾飘动 */
  .scarf-tail {
    transform-origin: 402px 176px;
    animation: flap 0.9s ease-in-out infinite alternate;
  }
  @keyframes flap {
    from { transform: rotate(-7deg); }
    to   { transform: rotate(10deg); }
  }

  /* 尾羽轻摆 */
  .tail {
    transform-origin: 288px 228px;
    animation: tailwag 1.6s ease-in-out infinite alternate;
  }
  @keyframes tailwag {
    from { transform: rotate(-4deg); }
    to   { transform: rotate(6deg); }
  }

  /* 速度线 */
  .speed-line { animation: zoom 0.9s linear infinite; }
  .speed-line.s2 { animation-delay: -0.3s; }
  .speed-line.s3 { animation-delay: -0.6s; }
  @keyframes zoom {
    0%   { opacity: 0; transform: translateX(40px); }
    35%  { opacity: .75; }
    100% { opacity: 0; transform: translateX(-130px); }
  }
</style>
</head>
<body>
<div class="card">
  <h1>骑自行车的鹈鹕<small>一只赶路的大嘴鸟 · 纯 SVG 动画</small></h1>

  <svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕骑着红色自行车在乡间小路上行驶的二维动画">
    <defs>

    <!-- 云 -->

    <!-- 速度线 -->

          <line x1="270" y1="318" x2="230" y2="426"/>
          <line x1="196" y1="352" x2="304" y2="392"/>
          <line x1="196" y1="392" x2="304" y2="352"/>

          <line x1="523" y1="335" x2="597" y2="409"/>
          <line x1="597" y1="335" x2="523" y2="409"/>
          <line x1="540" y1="318" x2="580" y2="426"/>
          <line x1="580" y1="318" x2="540" y2="426"/>
          <line x1="506" y1="352" x2="614" y2="392"/>
          <line x1="506" y1="392" x2="614" y2="352"/>
        </g>
        <circle cx="560" cy="372" r="8" fill="#607d8b"/>
        <circle cx="560" cy="372" r="3" fill="#eceff1"/>
      </g>

      <!-- 车架 -->
      <g fill="none" stroke="#e53935" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
        <path d="M250 372 L338 282 L400 378 Z"/>
        <path d="M338 282 L518 268 L400 378"/>
        <path d="M518 268 L536 318"/>
      </g>
      <!-- 前叉 + 后支撑 -->
      <g fill="none" stroke="#546e7a" stroke-width="9" stroke-linecap="round">
        <path d="M536 318 L560 372"/>
        <path d="M250 372 L338 282" stroke="#e53935" stroke-width="0"/>
      </g>
      <!-- 链条 -->
      <path d="M250 372 L400 378" fill="none" stroke="#455a64" stroke-width="3" stroke-dasharray="6 4"/>
      <circle cx="400" cy="378" r="15" fill="#37474f"/>
      <circle cx="400" cy="378" r="8" fill="#90a4ae"/>

      <!-- 座垫与座杆 -->
      <path d="M338 282 L332 263" stroke="#546e7a" stroke-width="7" stroke-linecap="round"/>

      <!-- 车把 + 铃铛 -->

      <path d="M486 240 Q 512 232 538 242" fill="none" stroke="#37474f" stroke-width="9" stroke-linecap="round"/>
      <circle cx="531" cy="236" r="7" fill="#fdd835" stroke="#f9a825" stroke-width="2"/>

      <!-- 曲柄与踏板（绕中轴旋转） -->
      <g id="crank">
        <path d="M400 378 L442 378" stroke="#455a64" stroke-width="8" stroke-linecap="round"/>
        <rect x="432" y="371" width="24" height="9" rx="3" fill="#263238"/>
        <path d="M400 378 L358 378" stroke="#78909c" stroke-width="8" stroke-linecap="round"/>
        <rect x="344" y="371" width="24" height="9" rx="3" fill="#263238"/>
      </g>

      <!-- ===== 鹈鹕 ===== -->
      <!-- 尾巴 -->
      <g class="tail">
        <path d="M288 226 Q 250 205 232 215 Q 258 226 272 238 Q 246 244 236 258 Q 268 253 292 240 Z" fill="#f2efe3" stroke="#ded9c8" stroke-width="2" stroke-linejoin="round"/>

      <!-- 远侧翅膀（搭在车把上） -->
      <path d="M356 214 Q 420 236 497 239 Q 505 245 498 250 Q 420 254 355 232 Z" fill="#e6e2d5" stroke="#d6d1c1" stroke-width="2"/>

      <!-- 脖子 -->

      <path d="M368 214 C 398 200, 406 160, 450 152" fill="none" stroke="#e8e4d7" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

      <path d="M500 165 Q 522 196 548 197" fill="none" stroke="#ffb877" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
      <!-- 上喙 -->

      <path d="M600 150 Q 609 153 601 159" fill="none" stroke="#e8701f" stroke-width="3" stroke-linecap="round"/>

      <circle cx="482" cy="132" r="1.6" fill="#ffffff"/>

      <!-- 红围巾 -->

      <!-- 近侧翅膀（伸向车把） -->
      <path d="M352 218 Q 420 228 500 240 Q 510 244 503 251 Q 420 252 350 236 Z"
            fill="#fffdf6" stroke="#ddd8c9" stroke-width="2"/>
      <path d="M395 230 Q 447 238 492 244" fill="none" stroke="#e5e0d1" stroke-width="2.5" stroke-linecap="round"/>

      <!-- 腿（由脚本实时求解 IK，踩在踏板上） -->
      <path id="legBack" fill="none" stroke="#e8912f" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="legFront" fill="none" stroke="#ffab3d" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

      <ellipse id="footFront" rx="16" ry="7.5" fill="#ffab3d"/>

</div>

<script>
  (function () {
    const svgNS = 'http://www.w3.org/2000/svg';
    const scene   = document.getElementById('scene');
    const crank   = document.getElementById('crank');
    const rear    = document.getElementById('rearWheel');
    const front   = document.getElementById('frontWheel');
    const rearSp  = document.getElementById('rearSpokes');
    const frontSp = document.getElementById('frontSpokes');
    const legBack = document.getElementById('legBack');
    const legFront= document.getElementById('legFront');
    const footBack= document.getElementById('footBack');
    const footFront=document.getElementById('footFront');

    const BB = { x: 400, y: 378 };        // 中轴
    const CRANK_R = 42;                    // 曲柄长度
    const H_BACK  = { x: 341, y: 262 };    // 后腿髋部
    const H_FRONT = { x: 357, y: 264 };    // 前腿髋部
    const THIGH = 95, SHIN = 85;           // 大腿 / 小腿长度
    const GEAR = 3;                        // 车轮转速 / 曲柄转速
    const PERIOD = 1900;                   // 曲柄一圈毫秒数

    // 两连杆 IK：由髋部 H 和脚 P 求膝盖 K
    function knee(H, P, l1, l2) {
      const dx = P.x - H.x, dy = P.y - H.y;
      const raw = Math.hypot(dx, dy);
      const d = Math.max(Math.abs(l1 - l2) + 0.01, Math.min(l1 + l2 - 0.01, raw));
      const ux = dx / raw, uy = dy / raw;
      const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
      const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
      // 取使膝盖位于前上方的解（鸟腿向前弯）
      return {
        x: H.x + ux * a + uy * h,
        y: H.y + uy * a - ux * h
      };
    }

    function setLeg(legEl, footEl, hip, pedal, strokeW) {
      const k = knee(hip, pedal, THIGH, SHIN);
      legEl.setAttribute('d', `M ${hip.x} ${hip.y} L ${k.x} ${k.y} L ${pedal.x} ${pedal.y}`);
      footEl.setAttribute('cx', pedal.x);
      footEl.setAttribute('cy', pedal.y - 2);
    }

    function frame(now) {
      const theta = (now / PERIOD) * Math.PI * 2;

      // 两个踏板相差 180°
      const pedalA = {
        x: BB.x + CRANK_R * Math.cos(theta),
        y: BB.y + CRANK_R * Math.sin(theta)
      };
      const pedalB = {
        x: BB.x + CRANK_R * Math.cos(theta + Math.PI),
        y: BB.y + CRANK_R * Math.sin(theta + Math.PI)
      };

      // 曲柄旋转
      const deg = theta * 180 / Math.PI;
      crank.setAttribute('transform', `rotate(${deg} ${BB.x} ${BB.y})`);

      // 车轮旋转（齿轮比放大），辐条与轮胎同步
      const wheelDeg = deg * GEAR;
      [rear, front].forEach(function (g) {
        g.setAttribute('transform', `rotate(${wheelDeg} ${g === rear ? 250 : 560} 372)`);
      });
      // 上面整组旋转已包含辐条，无需额外处理；保持引用以防结构改动
      void rearSp; void frontSp;

      // 腿部跟随踏板
      setLeg(legFront, footFront, H_FRONT, pedalA);
      setLeg(legBack,  footBack,  H_BACK,  pedalB);

      // 车身随踩踏节奏轻微起伏（每圈两次）
      scene.setAttribute('transform', `translate(0 ${(Math.sin(2 * theta) * 2.6).toFixed(2)})`);

      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  })();
</script>
</body>
</html>
