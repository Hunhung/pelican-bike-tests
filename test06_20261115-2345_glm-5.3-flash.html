<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #aee3f5 0%, #d9f2fb 55%, #f7e9c4 100%);
    font-family: "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  h1 {
    color: #3a6b7d;
    font-size: 22px;
    margin-bottom: 12px;
    letter-spacing: 2px;
  }
  .scene {
    width: 860px;
    max-width: 96vw;
    border-radius: 18px;
    box-shadow: 0 12px 40px rgba(30, 80, 100, 0.25);
    background: linear-gradient(180deg, #bfe9f7 0%, #e6f7fd 70%, #f2e2b3 100%);
    overflow: hidden;
  }
  p.tip { margin-top: 14px; color: #6b8a96; font-size: 13px; }
</style>
</head>
<body>

<h1>🚲 鹈鹕骑行记 · SVG 2D 动画</h1>

<div class="scene">
<svg viewBox="0 0 860 480" width="100%" xmlns="http://www.w3.org/2000/svg">
  <!-- ========== 太阳 ========== -->
  <circle cx="740" cy="80" r="38" fill="#ffd45e">
    <animate attributeName="r" values="38;41;38" dur="4s" repeatCount="indefinite"/>
  </circle>
  <g stroke="#ffd45e" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <line x1="740" y1="28" x2="740" y2="14"/>
    <line x1="740" y1="132" x2="740" y2="146"/>
    <line x1="688" y1="80" x2="674" y2="80"/>
    <line x1="792" y1="80" x2="806" y2="80"/>
    <line x1="703" y1="43" x2="693" y2="33"/>
    <line x1="777" y1="117" x2="787" y2="127"/>
    <line x1="703" y1="117" x2="693" y2="127"/>
    <line x1="777" y1="43" x2="787" y2="33"/>
  </g>

  <!-- ========== 云朵（向左飘） ========== -->
  <g fill="#ffffff" opacity="0.9">
    <g>
      <ellipse cx="150" cy="80" rx="46" ry="18"/>
      <ellipse cx="185" cy="68" rx="34" ry="16"/>
      <ellipse cx="118" cy="70" rx="28" ry="13"/>
      <animateTransform attributeName="transform" type="translate"
        values="0,0; -160,0" dur="9s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="520" cy="120" rx="38" ry="14"/>
      <ellipse cx="548" cy="110" rx="26" ry="12"/>
      <animateTransform attributeName="transform" type="translate"
        values="0,0; -700,0" dur="14s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ========== 远处山丘 ========== -->
  <path d="M0,360 Q140,270 300,350 T620,340 T860,360 L860,480 L0,480 Z"
        fill="#cde8c9" opacity="0.7"/>
  <path d="M0,395 Q200,330 430,390 T860,385 L860,480 L0,480 Z"
        fill="#b3dba8" opacity="0.8"/>

  <!-- ========== 地面（虚线滚动，模拟前进） ========== -->
  <rect x="0" y="400" width="860" height="80" fill="#e8d59a"/>
  <rect x="0" y="400" width="860" height="6" fill="#c9b476"/>
  <g stroke="#b59d5e" stroke-width="5" stroke-linecap="round" stroke-dasharray="30 46">
    <line x1="-100" y1="430" x2="960" y2="430">
      <animate attributeName="stroke-dashoffset" from="0" to="-152" dur="0.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- 小草快速向后掠过 -->
  <g stroke="#7fae6d" stroke-width="3" stroke-linecap="round">
    <g id="grass1">
      <path d="M60,432 q-4,-14 2,-22" fill="none"/>
      <path d="M66,432 q4,-12 0,-20" fill="none"/>
      <path d="M420,432 q-4,-14 2,-22" fill="none"/>
      <path d="M700,432 q-4,-14 2,-22" fill="none"/>
      <animateTransform attributeName="transform" type="translate"
        values="0,0; -340,0" dur="0.85s" repeatCount="indefinite"/>
    </g>
    <g id="grass2">
      <path d="M230,448 q-4,-12 2,-20" fill="none"/>
      <path d="M560,448 q-4,-12 2,-20" fill="none"/>
      <path d="M800,448 q-4,-12 2,-20" fill="none"/>
      <animateTransform attributeName="transform" type="translate"
        values="0,0; -340,0" dur="0.85s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ==================== 鹈鹕 + 自行车 ==================== -->
  <!-- 整体轻微上下颠簸 -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,-5; 0,0" dur="0.6s" repeatCount="indefinite"/>

    <!-- ========== 自行车 ========== -->
    <g stroke="#d94f4f" stroke-width="7" fill="none" stroke-linecap="round">
      <!-- 车架 -->
      <path d="M330,392 L400,320 L490,392 Z"/>
      <path d="M400,320 L430,255 L490,392"/>
      <path d="M430,255 L355,268 L330,392"/>
      <!-- 车座杆 -->
      <line x1="355" y1="268" x2="345" y2="245" stroke="#333" stroke-width="8"/>
      <!-- 车把杆 -->
      <line x1="430" y1="255" x2="440" y2="230" stroke="#333" stroke-width="8"/>
      <path d="M440,230 q22,-8 30,10" stroke="#333" stroke-width="8"/>
    </g>

    <!-- 车座 -->
    <ellipse cx="342" cy="242" rx="24" ry="9" fill="#2b2b2b"/>

    <!-- 后轮 -->
    <g transform="translate(330,392)">
      <circle r="52" fill="none" stroke="#2b2b2b" stroke-width="9"/>
      <circle r="6" fill="#555"/>
      <g stroke="#9aa3ab" stroke-width="2.5">
        <line x1="0" y1="-48" x2="0" y2="48"/>
        <line x1="-48" y1="0" x2="48" y2="0"/>
        <line x1="-34" y1="-34" x2="34" y2="34"/>
        <line x1="-34" y1="34" x2="34" y2="-34"/>
        <animateTransform attributeName="transform" type="rotate"
          from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- 前轮 -->
    <g transform="translate(490,392)">
      <circle r="52" fill="none" stroke="#2b2b2b" stroke-width="9"/>
      <circle r="6" fill="#555"/>
      <g stroke="#9aa3ab" stroke-width="2.5">
        <line x1="0" y1="-48" x2="0" y2="48"/>
        <line x1="-48" y1="0" x2="48" y2="0"/>
        <line x1="-34" y1="-34" x2="34" y2="34"/>
        <line x1="-34" y1="34" x2="34" y2="-34"/>
        <animateTransform attributeName="transform" type="rotate"
          from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- 曲柄 + 踏板（中轴 400,392） -->
    <g transform="translate(400,392)">
      <circle r="10" fill="#444"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
        <line x1="0" y1="0" x2="0" y2="-34" stroke="#333" stroke-width="5"/>
        <line x1="0" y1="0" x2="0" y2="34" stroke="#333" stroke-width="5"/>
        <rect x="-10" y="-40" width="20" height="7" rx="3" fill="#222"/>
        <rect x="-10" y="33" width="20" height="7" rx="3" fill="#222"/>
      </g>
    </g>

    <!-- ========== 鹈鹕 ========== -->
    <!-- 尾羽 -->
    <path d="M268,232 q-42,4 -58,32 q26,10 52,-6 Z" fill="#f5f5f0" stroke="#d8d4c8" stroke-width="2"/>

    <!-- 身体 -->
    <ellipse cx="330" cy="210" rx="62" ry="46" fill="#fbfbf7" stroke="#ddd8ca" stroke-width="2"/>
    <!-- 翅膀（微微扇动） -->
    <path d="M300,190 q-30,18 -8,48 q30,6 42,-22 q-14,-28 -34,-26 Z"
          fill="#efeee6" stroke="#d8d4c8" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate"
        values="0 320 210; -7 320 210; 0 320 210" dur="1.2s" repeatCount="indefinite"/>
    </path>

    <!-- 脖子（S形） -->
    <path d="M352,180 q30,-24 26,-62 q-2,-22 18,-30"
          fill="none" stroke="#fbfbf7" stroke-width="26" stroke-linecap="round"/>
    <path d="M352,180 q30,-24 26,-62 q-2,-22 18,-30"
          fill="none" stroke="#e6e2d4" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

    <!-- 头部 -->
    <circle cx="402" cy="82" r="30" fill="#fbfbf7" stroke="#ddd8ca" stroke-width="2"/>
    <!-- 头顶小羽冠 -->
    <path d="M388,56 q6,-16 20,-14 q-8,6 -8,16 Z" fill="#e8e4d6"/>

    <!-- 标志性大嘴（上喙 + 喉囊） -->
    <path d="M414,74 L510,86 L414,96 Z" fill="#f5a623" stroke="#d98c10" stroke-width="2" stroke-linejoin="round"/>
    <path d="M416,94 q44,40 84,-6 q-40,10 -84,6 Z" fill="#f7b84a" stroke="#d98c10" stroke-width="2"/>
    <circle cx="466" cy="83" r="2.5" fill="#8a5c08">
      <animate attributeName="opacity" values="1;0.4;1" dur="0.8s" repeatCount="indefinite"/>
    </circle>

    <!-- 眼睛（偶尔眨眼） -->
    <circle cx="410" cy="68" r="7" fill="#fff" stroke="#c9c4b4" stroke-width="1.5"/>
    <circle cx="412" cy="68" r="3.6" fill="#222"/>
    <circle cx="413.5" cy="66.5" r="1.3" fill="#fff"/>
    <g>
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.9;0.92;0.96;1"
               dur="4s" repeatCount="indefinite"/>
      <circle cx="410" cy="68" r="7.5" fill="#fbfbf7"/>
    </g>

    <!-- 车把上的翅膀（握把） -->
    <path d="M420,240 q18,-14 44,-6 q-4,14 -22,16 q-16,2 -22,-10 Z"
          fill="#efeee6" stroke="#d8d4c8" stroke-width="2"/>

    <!-- 腿（蹬踏板动画：两腿相位相反） -->
    <!-- 踏板位置: cx=400 cy=392, 半径34 -->
    <!-- 近侧腿（橙色） -->
    <g>
      <animate attributeName="d"
        values="M352,246 Q370,330 400,358;
                M352,246 Q382,336 434,392;
                M352,246 Q370,330 400,426;
                M352,246 Q352,320 366,392;
                M352,246 Q370,330 400,358"
        dur="0.9s" repeatCount="indefinite"
        keyTimes="0;0.25;0.5;0.75;1"/>
      <path d="M352,246 Q370,330 400,358" fill="none" stroke="#f0862a" stroke-width="9" stroke-linecap="round"/>
      <!-- 脚 -->
      <path d="M400,358 l16,6" stroke="#f0862a" stroke-width="7" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate"
          from="0 400 392" to="360 400 392" dur="0.9s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- 远侧腿（颜色略深，在身体后面 → 放在自行车图层其实应更早，这里简化用暗色） -->
    <g opacity="0.75">
      <animate attributeName="d"
        values="M348,246 Q366,330 400,426;
                M348,246 Q352,320 366,392;
                M348,246 Q370,330 400,358;
                M348,246 Q382,336 434,392;
                M348,246 Q366,330 400,426"
        dur="0.9s" repeatCount="indefinite"
        keyTimes="0;0.25;0.5;0.75;1"/>
      <path d="M348,246 Q366,330 400,426" fill="none" stroke="#c96a14" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 尘土/速度线（在车后方） -->
  <g stroke="#c9c4b4" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <line x1="240" y1="330" x2="290" y2="330">
      <animate attributeName="opacity" values="0.7;0" dur="0.7s" repeatCount="indefinite"/>
      <animate attributeName="x1" values="290;230" dur="0.7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="340;280" dur="0.7s" repeatCount="indefinite"/>
    </line>
    <line x1="240" y1="360" x2="300" y2="360">
      <animate attributeName="opacity" values="0.5;0" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="x1" values="300;240" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="360;300" dur="0.9s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
</div>

<p class="tip">轮子在转 · 腿在蹬 · 云在飘 · 大嘴鹈鹕匀速巡航中 🐦</p>

</body>
</html>
