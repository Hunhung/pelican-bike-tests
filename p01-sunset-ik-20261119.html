<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕骑自行车</title>
<style>
  :root{ --paper:#F7F0E4; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px;
    background:var(--paper);
    font-family:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .frame{
    width:min(94vw,1180px);
    border-radius:20px;
    overflow:hidden;
    background:#FFF3E0;
    line-height:0;
    box-shadow:0 26px 64px -26px rgba(122,94,60,.45), 0 0 0 1px rgba(255,255,255,.6) inset;
  }
  svg{ display:block; width:100%; height:auto; }
  .cap{ font-size:12px; letter-spacing:.26em; text-transform:uppercase; color:#A48C72; }

  .cloud{ animation: drift 24s ease-in-out infinite alternate; }
  .cloudb{ animation-duration:33s; }
  .cloudc{ animation-duration:28s; }
  @keyframes drift{
    from{ transform:translateX(0); }
    to{ transform:translateX(-58px); }
  }

  #dashGroup{ animation: road .45s linear infinite; }
  @keyframes road{ from{ transform:translateX(0); } to{ transform:translateX(-94px); } }

  .streak{ animation: streak 1.15s linear infinite; }
  .streak.b{ animation-delay:.4s; }
  .streak.c{ animation-delay:.8s; }
  @keyframes streak{
    0%{ transform:translateX(70px); opacity:0; }
    18%{ opacity:.5; }
    100%{ transform:translateX(-300px); opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    .cloud, #dashGroup, .streak{ animation:none; }
  }
</style>
</head>
<body>

<div class="frame">

    <!-- ---------- 前轮 ---------- -->
    <circle cx="770" cy="510" r="80" fill="none" stroke="#453B34" stroke-width="9"/>

        <line x1="721.9" y1="461.9" x2="818.1" y2="558.1"/>
        <line x1="744" y1="447.2" x2="796" y2="572.8"/>
        <line x1="770" y1="442" x2="770" y2="578"/>
      </g>
      <circle cx="770" cy="510" r="11" fill="#453B34"/>
      <circle cx="770" cy="442" r="4.5" fill="#E2655B"/>
    </g>

    <!-- 远侧腿（在车架后方） -->
    <polyline id="legF" points="520 354 560 420 516 518" fill="none" stroke="#C08657" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>

    <!-- ---------- 车架 ---------- -->
    <g stroke="#2F6F6A" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M548 532 L470 510"/>
      <path d="M498 372 L470 510"/>
      <path d="M498 372 L548 532"/>
      <path d="M498 372 C 566 374 646 384 724 394"/>
      <path d="M548 532 C 600 500 660 480 704 468"/>
      <path d="M724 394 L704 468"/>
      <path d="M704 468 C 730 486 750 500 770 510"/>
      <path d="M724 394 C 730 380 737 371 745 363"/>
      <path d="M745 363 C 756 356 766 353 775 357"/>
    </g>

    <!-- 链条 -->
    <g stroke="#8D9CA1" stroke-width="2.5" fill="none" opacity=".8">
      <path d="M528 546 L466 522"/>
      <path d="M568 548 L480 520"/>
    </g>

    <!-- 车座 -->
    <path d="M460 368 C 478 356 520 354 536 364 C 539 372 530 379 514 380 C 486 382 466 378 460 368 Z" fill="#6B4A34"/>

    <!-- ---------- 曲柄与踏板 ---------- -->
    <g id="crank">
      <circle cx="548" cy="532" r="22" fill="none" stroke="#3E5560" stroke-width="3"/>
      <circle cx="548" cy="532" r="7" fill="#3E5560"/>
      <line x1="548" y1="532" x2="516" y2="532" stroke="#3E5560" stroke-width="5" stroke-linecap="round"/>
      <line x1="548" y1="532" x2="580" y2="532" stroke="#4A6470" stroke-width="6" stroke-linecap="round"/>

      <g id="pedalF">
        <rect x="501" y="528" width="30" height="8" rx="4" fill="#3E5560"/>
        <path d="M510 525 C 512 511 526 503 544 504 C 552 505 556 510 553 516 C 549 522 534 528 516 529 Z" fill="#C98B5E"/>
        <path d="M532 512 L542 507" stroke="#A45F2C" stroke-width="2" fill="none"/>
      </g>

      <g id="pedalN">
        <rect x="565" y="528" width="30" height="8" rx="4" fill="#4A6470"/>
        <path d="M568 525 C 570 511 584 503 602 504 C 610 505 614 510 611 516 C 607 522 592 528 574 529 Z" fill="#E88F4E"/>
        <path d="M590 512 L600 507" stroke="#C9743A" stroke-width="2" fill="none"/>
      </g>
    </g>

    <!-- ---------- 近侧腿（脚本做两段式 IK） ---------- -->
    <polyline id="legN" points="536 350 578 420 580 518" fill="none" stroke="#E88F4E" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- ---------- 鹈鹕 ---------- -->
    <g id="pelican">

      <!-- 尾羽与翼尖：从身体后缘伸出的羽片 -->
      <g id="wing">
        <path d="M494 264 C 462 250 430 244 414 252 C 424 264 458 274 494 284 Z" fill="#E6D1AC"/>
        <path d="M490 288 C 456 278 422 278 406 288 C 418 300 452 300 490 300 Z" fill="#D9C298"/>
        <path d="M490 310 C 458 308 426 314 410 324 C 424 336 456 320 492 318 Z" fill="#E6D1AC"/>
      </g>

      <!-- 身体（前倾） -->
      <path d="M460 320 C 462 286 498 258 552 250 C 606 242 638 266 646 298 C 652 330 612 364 558 364 C 512 364 468 352 460 320 Z" fill="#FFFFFF"/>
      <!-- 腹部阴影 -->
      <path d="M472 334 C 500 356 546 364 588 356 C 620 348 642 324 646 304 C 644 340 608 366 558 366 C 514 366 482 352 472 334 Z" fill="#EFDFC6" opacity=".95"/>
      <!-- 背部结构线 -->
      <path d="M478 306 C 500 278 532 262 566 258" stroke="#F4E8D6" stroke-width="4" fill="none" opacity=".9"/>
      <!-- 肩部羽纹 -->
      <path d="M600 284 C 610 306 606 328 590 342" stroke="#F1E3CA" stroke-width="5" fill="none" opacity=".9"/>
      <path d="M588 274 C 598 296 594 316 578 330" stroke="#F1E3CA" stroke-width="3" fill="none" opacity=".8"/>

      <!-- 脖颈 -->
      <path d="M580 288 C 578 244 596 204 644 182 C 668 194 674 218 656 232 C 634 248 610 268 602 300 Z" fill="#FFFFFF"/>

      <!-- 头 + 喙 -->

        <path d="M646 124 C 630 110 610 104 600 110 C 612 122 630 138 646 148 Z" fill="#F1E4D1"/>
        <ellipse cx="688" cy="152" rx="52" ry="45" transform="rotate(-8 688 152)" fill="#FFFFFF"/>
        <ellipse cx="668" cy="176" rx="16" ry="9" fill="#F4A992" opacity=".48"/>
        <path id="pouch" d="M714 148 C 712 206 758 252 864 182 C 816 196 760 178 714 148 Z" fill="#F9BE82"/>
        <path d="M720 172 C 734 202 760 222 798 218" stroke="#F2A96A" stroke-width="3" fill="none" opacity=".5"/>
        <path d="M716 122 C 792 126 862 148 888 172 C 880 180 862 182 846 179 C 800 172 746 158 714 150 Z" fill="#F5A452"/>

        <circle cx="707" cy="135" r="2.6" fill="#FFFFFF"/>

      </g>

      <!-- 围巾：绕颈一圈，飘带向身后扬起 -->
      <path id="scarf" d="M604 250 L500 216 L500 230 L604 264 Z" fill="#E2655B"/>
      <path d="M586 266 C 596 252 614 242 640 236" stroke="#E2655B" stroke-width="12" stroke-linecap="round" fill="none"/>
      <path d="M602 248 C 613 241 627 244 628 254 C 625 264 611 266 603 259 Z" fill="#D9554B"/>

    </g>

    <!-- 车把末端握把，压在翅膀尖端上，形成握持 -->
    <rect x="754" y="347" width="28" height="14" rx="7" fill="#6B4A34"/>

  </g>

</div>

<div class="cap">Pelican on a Bicycle · SVG</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);

  /* ---- 自行车几何（局部坐标） ---- */
  const BB    = { x: 548, y: 532 };
  const CR    = 32;
  const HIP   = { n: { x: 536, y: 350 }, f: { x: 520, y: 354 } };
  const L1 = 112, L2 = 118;
  const ANKLE = -14;

  const spokesR = $('spokesR'), spokesF = $('spokesF');
  const crank = $('crank'), pedalN = $('pedalN'), pedalF = $('pedalF');
  const legN = $('legN'), legF = $('legF');
  const pelican = $('pelican'), wing = $('wing');
  const scarf = $('scarf'), pouch = $('pouch'), headGroup = $('headGroup');

  /* ---- 两段式反向运动学：已知髋与脚，求膝盖（朝前） ---- */
  function knee(hx, hy, fx, fy) {
    let dx = fx - hx, dy = fy - hy;
    let d = Math.hypot(dx, dy);
    const maxD = L1 + L2 - 1, minD = Math.abs(L1 - L2) + 1;
    if (d > maxD) { dx *= maxD / d; dy *= maxD / d; d = maxD; }
    if (d < minD) { dx *= minD / d; dy *= minD / d; d = minD; }
    const ux = dx / d, uy = dy / d;
    const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
    const mx = hx + ux * a, my = hy + uy * a;
    const k1 = { x: mx - uy * h, y: my + ux * h };
    const k2 = { x: mx + uy * h, y: my - ux * h };
    return k1.x > k2.x ? k1 : k2;   // 膝盖朝前
  }

  const foot = (deg) => {
    const a = deg * Math.PI / 180;
    return { x: BB.x + CR * Math.cos(a), y: BB.y + CR * Math.sin(a) + ANKLE };
  };

  function setLeg(el, hip, f) {
    const k = knee(hip.x, hip.y, f.x, f.y);
    el.setAttribute('points',
      hip.x.toFixed(1) + ' ' + hip.y.toFixed(1) + ' ' +
      k.x.toFixed(1) + ' ' + k.y.toFixed(1) + ' ' +
      f.x.toFixed(1) + ' ' + f.y.toFixed(1));
  }

  /* ---- 飘带：沿中轴生成有宽度的布带 ---- */
  function ribbon(t) {
    const N = 9, up = [], dn = [];
    for (let i = 0; i <= N; i++) {
      const x = 600 - i * 12.5;
      const y = 248 - i * 6.2 + 9 * Math.sin(i * 0.8 - t * 5.2);
      const w = 8.5 * (1 - (i / N) * 0.5);
      up.push(x.toFixed(1) + ' ' + (y - w).toFixed(1));
      dn.unshift(x.toFixed(1) + ' ' + (y + w).toFixed(1));
    }
    return 'M ' + up.join(' L ') + ' L ' + dn.join(' L ') + ' Z';
  }

  /* 支持用 #数字 冻结在某一帧；系统开启「减少动态效果」时只画一帧 */
  const FREEZE = parseFloat(location.hash.slice(1));
  const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---- 主循环 ---- */
  let t0 = null;
  function frame(now) {
    if (t0 === null) t0 = now;
    const t = isFinite(FREEZE) ? FREEZE : (now - t0) / 1000;

    const wheelAng = t * 150;
    const crankAng = t * 68;

    spokesR.setAttribute('transform', 'rotate(' + wheelAng.toFixed(2) + ' 470 510)');
    spokesF.setAttribute('transform', 'rotate(' + wheelAng.toFixed(2) + ' 770 510)');

    crank.setAttribute('transform', 'rotate(' + crankAng.toFixed(2) + ' 548 532)');
    pedalN.setAttribute('transform', 'rotate(' + (-crankAng).toFixed(2) + ' 580 532)');
    pedalF.setAttribute('transform', 'rotate(' + (-crankAng).toFixed(2) + ' 516 532)');

    const bob = 2.6 * Math.sin(t * 3.3);
    pelican.setAttribute('transform', 'translate(0,' + bob.toFixed(2) + ')');
    headGroup.setAttribute('transform',
      'rotate(' + (2.2 * Math.sin(t * 3.3 + 1.1)).toFixed(2) + ' 640 240)');
    wing.setAttribute('transform',
      'rotate(' + (1.1 * Math.sin(t * 3.3 + 2)).toFixed(2) + ' 496 296)');
    pouch.setAttribute('transform',
      'translate(714,150) scale(1,' + (1 + 0.07 * Math.sin(t * 3.3 + 0.9)).toFixed(3) +
      ') translate(-714,-150)');

    scarf.setAttribute('d', ribbon(t));

    setLeg(legN, { x: HIP.n.x, y: HIP.n.y + bob * 0.9 }, foot(crankAng));
    setLeg(legF, { x: HIP.f.x, y: HIP.f.y + bob * 0.9 }, foot(crankAng + 180));

    if (!REDUCED) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
