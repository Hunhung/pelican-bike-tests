<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑车</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='13' cy='15' r='9' fill='%23FCF4E2' stroke='%231F2B2E' stroke-width='2'/%3E%3Cpath d='M21 12 L31 15.5 L21 19 Z' fill='%23EFC55F' stroke='%231F2B2E' stroke-width='1.5'/%3E%3C/svg%3E">
<style>
  :root{
    --sky:#E3EFE6;
    --ink:#1F2B2E;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--sky);
    color:var(--ink);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    font-family:"Songti SC","Source Han Serif SC","Noto Serif SC","SimSun",serif;
  }
  .stage{
    position:relative;
    width:100%;
    height:100vh;
    height:100svh;
    overflow:hidden;
  }
  #scene{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
  }
  .hud{
    position:absolute;
    left:0; right:0; bottom:0;
    padding:0 26px calc(22px + env(safe-area-inset-bottom, 0px));
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    pointer-events:none;
  }
  .caption{
    margin:0;
    font-size:12.5px;
    line-height:1.5;
    letter-spacing:.18em;
    color:var(--ink);
    opacity:.72;
  }
  .play{
    pointer-events:auto;
    width:40px; height:40px;
    display:grid; place-items:center;
    padding:0;
    border:1px solid rgba(31,43,46,.32);
    border-radius:50%;
    background:rgba(252,244,226,.72);
    color:var(--ink);
    cursor:pointer;
    transition:background .18s ease, transform .18s ease;
  }
  .play:hover{background:rgba(252,244,226,.96);}
  .play:active{transform:scale(.94);}
  .play:focus-visible{outline:2px solid #D8553C; outline-offset:3px;}
  .play svg{width:18px; height:18px; fill:currentColor;}
  #iconPlay{display:none;}

  /* 窄屏：整幅构图按 1200:700 完整呈现，作为一个居中卡片，两侧不裁切 */
  @media (max-width:760px){
    body{display:flex; align-items:center; justify-content:center;}
    .stage{height:auto; width:100%; box-shadow:0 0 0 1px rgba(31,43,46,.2);}
    #scene{position:static; width:100%; height:auto; max-height:100svh; display:block;}
    .hud{padding:0 16px calc(10px + env(safe-area-inset-bottom, 0px));}
    .caption{font-size:10.5px;letter-spacing:.1em;}
    .play{width:34px;height:34px;}
    .play svg{width:15px;height:15px;}
  }
</style>
</head>
<body>
<div class="stage">

<svg id="scene" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" role="img" aria-label="一只鹈鹕骑着自行车沿海边前进的 2D 动画">

  <defs>

<script>
(function(){
  'use strict';

  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const TAU = Math.PI * 2;
  const DEG = 180 / Math.PI;

  /* ---------- 几何：与 SVG 里的坐标一一对应 ---------- */
  const BB   = { x: 570, y: 522 };   // 中轴
  const CRANK_R = 42;                // 曲柄长度
  const HIP  = { x: 528, y: 348 };   // 髋（坐在车座上）
  const L1 = 108, L2 = 118;          // 大腿 / 小腿长度

  const pedalAt = a => ({
    x: BB.x + CRANK_R * Math.cos(a),
    y: BB.y + CRANK_R * Math.sin(a)
  });

  // 两骨骼 IK：髋固定，脚跟着踏板走，膝盖朝前弯
  function kneeOf(h, p){
    const dx = p.x - h.x, dy = p.y - h.y;
    const raw = Math.hypot(dx, dy);
    const d = Math.max(Math.abs(L1 - L2) + 2, Math.min(raw, L1 + L2 - 2));
    const phi = Math.atan2(dy, dx);
    const cosA = (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d);
    const a = Math.acos(Math.min(1, Math.max(-1, cosA)));
    return { x: h.x + L1 * Math.cos(phi - a), y: h.y + L1 * Math.sin(phi - a) };
  }

  function setLeg(key, h, p, deg){
    const ankle = { x: p.x, y: p.y - 13 };   // 脚踝在踏板之上，脚掌踩着踏板
    const k = kneeOf(h, ankle);
    const dThigh = 'M' + h.x + ' ' + h.y.toFixed(2) + ' L' + k.x.toFixed(2) + ' ' + k.y.toFixed(2);
    const dShin  = 'M' + k.x.toFixed(2) + ' ' + k.y.toFixed(2) + ' L' + ankle.x.toFixed(2) + ' ' + ankle.y.toFixed(2);

    // 先给描边层，再给彩色层，保证压在车架上也能看清
    $(key + 'ThighO').setAttribute('d', dThigh);
    $(key + 'ShinO').setAttribute('d', dShin);
    $(key + 'Thigh').setAttribute('d', dThigh);
    $(key + 'Shin').setAttribute('d', dShin);

    const ko = $(key + 'KneeO'), kc = $(key + 'Knee');
    ko.setAttribute('cx', k.x.toFixed(2));
    ko.setAttribute('cy', k.y.toFixed(2));
    kc.setAttribute('cx', k.x.toFixed(2));
    kc.setAttribute('cy', k.y.toFixed(2));

    // 踏板反向旋转，始终保持水平
    $(key + 'Pedal').setAttribute('transform',
      'translate(' + p.x.toFixed(2) + ' ' + p.y.toFixed(2) + ') rotate(' + (-deg).toFixed(2) + ')');
  }

  /* ---------- 轮辐 ---------- */
  function buildSpokes(group, r, pairs, color){
    for (let i = 0; i < pairs; i++){
      const a = (180 / pairs) * i;
      const line = document.createElementNS(NS, 'line');
      line.setAttribute('x1', 0);
      line.setAttribute('y1', -r);
      line.setAttribute('x2', 0);
      line.setAttribute('y2', r);
      line.setAttribute('stroke', color);
      line.setAttribute('stroke-width', '2.6');
      line.setAttribute('transform', 'rotate(' + a + ')');
      group.appendChild(line);
    }
  }
  buildSpokes($('spokesRear'), 66, 7, '#243036');
  buildSpokes($('spokesFront'), 66, 7, '#243036');

  /* ---------- 云与海鸥的基准位置 ---------- */
  const clouds = [
    { id: 'c1', x: 248, y: 116, ph: 0 },
    { id: 'c2', x: 660, y: 76,  ph: 2.1 }
  ];
  const gulls = [
    { id: 'g1', x: 168, y: 86,  s: 0.9,  ph: 0 },
    { id: 'g2', x: 332, y: 138, s: 0.66, ph: 1.7 },
    { id: 'g3', x: 1052, y: 372, s: 0.5, ph: 3.2 }
  ];

  /* ---------- 围巾飘带：逐帧生成带正弦波动的带状路径 ---------- */
  const SCARF_A = { sx: 566, sy: 200, ex: 390, ey: 252, amp: 13, ph: 0,    w: 8 };
  const SCARF_B = { sx: 556, sy: 212, ex: 412, ey: 264, amp: 16, ph: 1.7,  w: 5.5 };

  function scarfD(t, c){
    const N = 9;
    const pts = [];
    for (let i = 0; i <= N; i++){
      const u = i / N;
      pts.push({
        u: u,
        x: c.sx + (c.ex - c.sx) * u,
        y: c.sy + (c.ey - c.sy) * u + Math.sin(u * 3.6 - t * 3.2 + c.ph) * c.amp * u
      });
    }
    const up = [], dn = [];
    for (let i = 0; i < pts.length; i++){
      const p = pts[i];
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len, ny = dx / len;
      const w = 2 + c.w * (1 - p.u * 0.55);
      up.push([p.x + nx * w, p.y + ny * w]);
      dn.push([p.x - nx * w, p.y - ny * w]);
    }
    const f = q => q[0].toFixed(1) + ' ' + q[1].toFixed(1);
    return 'M ' + up.map(f).join(' L ') + ' L ' + dn.reverse().map(f).join(' L ') + ' Z';
  }

  /* ---------- 逐帧绘制 ---------- */
  function render(t){
    // 曲柄一转 = 一次踩踏；约 0.92 转/秒
    const crankA = t * TAU * 0.92;
    const crankDeg = crankA * DEG;
    const bob = Math.sin(crankA * 2) * 2.4;          // 身体随踩踏轻微起伏

    // 车轮
    const wheelDeg = crankDeg * 2.65;
    $('spokesRear').setAttribute('transform', 'rotate(' + wheelDeg.toFixed(2) + ')');
    $('spokesFront').setAttribute('transform', 'rotate(' + wheelDeg.toFixed(2) + ')');

    // 曲柄 + 链条
    $('crank').setAttribute('transform', 'translate(' + BB.x + ' ' + BB.y + ') rotate(' + crankDeg.toFixed(2) + ')');
    $('chain').setAttribute('stroke-dashoffset', (-t * 90).toFixed(1));

    // 腿
    const hip = { x: HIP.x, y: HIP.y + bob };
    setLeg('near', hip, pedalAt(crankA), crankDeg);
    setLeg('far',  hip, pedalAt(crankA + Math.PI), crankDeg);

    // 鹈鹕
    $('pelican').setAttribute('transform', 'translate(0 ' + bob.toFixed(2) + ')');
    $('wing').setAttribute('transform', 'rotate(' + (Math.sin(crankA * 2 + 0.5) * 4).toFixed(2) + ' 560 262)');
    $('scarfPath').setAttribute('d', scarfD(t, SCARF_A));
    $('scarfPath2').setAttribute('d', scarfD(t, SCARF_B));
    $('head').setAttribute('transform', 'rotate(' + (Math.sin(crankA * 2 - 0.3) * 1.8).toFixed(2) + ' 552 246)');
    $('fish').setAttribute('transform', 'translate(30 -4) rotate(' + (Math.sin(t * 2.6) * 11).toFixed(2) + ')');

    // 背景视差：越远越慢
    $('seaWaves').setAttribute('patternTransform', 'translate(' + (-((t * 20) % 132)).toFixed(1) + ' 0)');
    $('roadDashes').setAttribute('patternTransform', 'translate(' + (-((t * 200) % 210)).toFixed(1) + ' 0)');
    $('island').setAttribute('transform', 'translate(' + (-((t * 3) % 1400)).toFixed(1) + ' 0)');

    clouds.forEach(c => {
      $('c' + c.id.slice(1)).setAttribute('transform',
        'translate(' + (c.x + Math.sin(t * 0.22 + c.ph) * 16).toFixed(1) + ' ' +
        (c.y + Math.sin(t * 0.4 + c.ph) * 4).toFixed(1) + ')');
    });

    gulls.forEach((g, i) => {
      const flap = 0.55 + 0.45 * Math.abs(Math.sin(t * 3.1 + g.ph));
      $(g.id).setAttribute('transform',
        'translate(' + (g.x + Math.sin(t * 0.35 + g.ph) * 7).toFixed(1) + ' ' +
        (g.y + Math.sin(t * 0.5 + g.ph) * 3).toFixed(1) + ') scale(' +
        g.s.toFixed(2) + ' ' + (g.s * flap).toFixed(2) + ')');
    });

    $('boat').setAttribute('transform',
      'translate(' + (898 + Math.sin(t * 0.28) * 14).toFixed(1) + ' ' +
      (468 + Math.sin(t * 0.6) * 3).toFixed(1) + ') rotate(' + (Math.sin(t * 0.6) * 1.5).toFixed(2) + ')');
  }

  /* ---------- 播放循环 ---------- */
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const playBtn = $('playBtn');
  const iconPause = $('iconPause');
  const iconPlay = $('iconPlay');

  let playing = true;
  let time = 0.62;           // 起手停在一个好看的踩踏角度
  let last = null;

  function loop(now){
    if (last === null) last = now;
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;         // 切后台回来不要跳帧
    if (playing) time += dt;
    render(time);
    requestAnimationFrame(loop);
  }

  function setPlaying(next){
    playing = next;
    playBtn.setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
    playBtn.setAttribute('aria-pressed', String(playing));
    iconPause.style.display = playing ? '' : 'none';
    iconPlay.style.display = playing ? 'none' : '';
    last = null;
  }

  playBtn.addEventListener('click', () => setPlaying(!playing));

  window.addEventListener('keydown', e => {
    if (e.code === 'Space' && (e.target === document.body || e.target === playBtn)){
      if (e.target === playBtn) return;          // 按钮自身的空格交给 click
      e.preventDefault();
      setPlaying(!playing);
    }
  });

  if (reduceMotion.matches){
    playing = false;
  }
  setPlaying(playing);
  render(time);
  requestAnimationFrame(loop);
})();
</script>
